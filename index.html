  function ecranQuestionsAccueil() {
    var profil = lireProfil();
    var porte = PORTES[0];
    var html = bandeau(porte.classe, porte.titre, porte.chapeau) +
      '<div class="page porte1">' +
        '<div class="porte1__colonne">' +
          formulaireRecherche("") +
          '<section aria-labelledby="titre-frequentes">' +
            '<h2 class="intertitre" id="titre-frequentes">Questions fréquentes</h2>' +
            '<p class="discret">' + esc(POUR_QUI[profil] || "") + "</p>" +
            listeQuestions(questionsFrequentes(profil)) +
          "</section>" +
        "</div>" +
        '<div class="porte1__colonne">' +
          '<section aria-labelledby="titre-themes">' +
            '<h2 class="intertitre" id="titre-themes">Par thème</h2>' + tuilesThemes() +
          "</section>" +
          encartSobriete() +
          encartProposer() +
        "</div>" +
      "</div>";
    return { html: html, titre: porte.titre, apres: brancherRecherche };
  }

  function ecranTheme(numero) {
    var nom = THEMES[numero - 1];
    if (!nom) return null;
    var questions = FAQ.filter(function (q) { return q["Thème"] === nom; });
    var pastille = '<span class="pastille">' + icone(ICONES_THEMES[numero - 1] || "question", 18) + "Thème</span>";
    var html = bandeau("question", nom, questions.length + " question" + (questions.length > 1 ? "s" : "") + " dans ce thème.", pastille) +
      '<div class="page page--etroite">' +
        listeQuestions(questions) +
        (numero - 1 === THEME_SOBRIETE ? encartSobriete() : "") +
        encartProposer() +
      "</div>";
    return { html: html, titre: nom };
  }

  function ecranRecherche(requete) {
    var res = rechercher(requete);
    var guillemets = "« " + requete + " »";
    var html;
    if (res.exacts.length) {
      var n = res.exacts.length;
      html = bandeau("question", n + " réponse" + (n > 1 ? "s" : "") + " pour " + guillemets) +
        '<div class="page page--etroite">' +
          listeQuestions(res.exacts) +
          '<section aria-labelledby="titre-autre"><h2 class="intertitre" id="titre-autre">Chercher autre chose</h2>' +
            formulaireRecherche(requete) + "</section>" +
          encartProposer() +
        "</div>";
      return { html: html, titre: "Recherche", annonce: n + " réponse" + (n > 1 ? "s" : "") + " trouvée" + (n > 1 ? "s" : "") + ".", apres: brancherRecherche };
    }

    // Aucun résultat : un ton doux, trois pistes
    var idees = suggestions(requete);
    html = bandeau("question", "Aucune réponse pour " + guillemets) +
      '<div class="page page--etroite">' +
        '<p class="chapeau">Pas de panique&nbsp;: voici trois pistes pour avancer.</p>' +
        '<section aria-labelledby="titre-autre-mot"><h2 class="intertitre" id="titre-autre-mot">Essayez un autre mot</h2>' +
          (idees.length ? '<ul class="pastilles-liens">' + idees.map(function (m) {
            return '<li><a href="#/questions/recherche/' + encodeURIComponent(m) + '">' + esc(m) + "</a></li>";
          }).join("") + "</ul>" : "") +
          formulaireRecherche(requete) +
        "</section>" +
        (res.proches.length ? '<section aria-labelledby="titre-proches"><h2 class="intertitre" id="titre-proches">Des questions qui s’en approchent</h2>' +
          listeQuestions(res.proches) + "</section>" : "") +
        '<section aria-labelledby="titre-glossaire"><h2 class="intertitre" id="titre-glossaire">Cherchez dans le glossaire</h2>' +
          '<a class="bouton bouton--contour bouton--plein" href="#/glossaire">' + icone("glossaire", 20) + "Ouvrir le glossaire</a>" +
        "</section>" +
        '<section aria-labelledby="titre-proposer-q"><h2 class="intertitre" id="titre-proposer-q">Proposez votre question</h2>' +
          "<p>L’équipe de l’ISFEC pourra l’ajouter à la FAQ. Pensez à y recopier votre question.</p>" +
          lienForms("Proposer une question pour la FAQ", "bouton bouton--plein", "#ffffff") + RAPPEL_ANONYME +
        "</section>" +
      "</div>";
    return { html: html, titre: "Aucune réponse", annonce: "Aucune réponse trouvée.", apres: brancherRecherche };
  }

  function ecranReponse(q) {
    var profil = lireProfil();
    var numeroTheme = THEMES.indexOf(q["Thème"]) + 1;
    var pastille = numeroTheme
      ? '<a class="pastille" href="#/questions/theme/' + numeroTheme + '">' + icone(ICONES_THEMES[numeroTheme - 1], 18) + esc(q["Thème"]) + "</a>"
      : "";
    // Questions liées : même thème, celles qui concernent le profil d'abord
    var memeTheme = FAQ.filter(function (x) { return x["Thème"] === q["Thème"] && x.ID !== q.ID; });
    var liees = memeTheme.filter(function (x) { return concerne(x, profil); })
      .concat(memeTheme.filter(function (x) { return !concerne(x, profil); })).slice(0, 3);

    var html = bandeau("question", q.Question, "", pastille) +
      '<div class="page page--etroite">' +
        '<section class="encadre" aria-labelledby="titre-essentiel">' +
          '<h2 class="intertitre" id="titre-essentiel">L’essentiel</h2>' +
          '<p class="texte-reponse">' + esc(q["Réponse"]) + "</p>" +
        "</section>" +
        '<p class="source"><strong>Source' + (/;/.test(q.Source) ? "s" : "") + "&nbsp;:</strong> " + esc(q.Source || "non précisée") +
          (q["Mise à jour"] ? "<br>Mise à jour&nbsp;: " + esc(q["Mise à jour"]) : "") + "</p>" +
        (numeroTheme - 1 === THEME_SOBRIETE ? encartSobriete() : "") +
        (liees.length ? '<section aria-labelledby="titre-liees"><h2 class="intertitre" id="titre-liees">Questions liées</h2>' +
          listeQuestions(liees) + "</section>" : "") +
        '<div class="bas-reponse">' +
          '<a class="lien-fort lien-icone" href="#/questions">' + icone("loupe", 20) + "Chercher une autre question</a>" +
          (LIEN_FORMS ? '<a class="lien-fort lien-icone" href="' + esc(LIEN_FORMS) + '" target="_blank" rel="noopener noreferrer">' +
            icone("envoyer", 20) + 'Proposer une autre question<span class="visuellement-cache"> (ouvre le formulaire dans un nouvel onglet)</span></a>' : "") +
        "</div>" +
      "</div>";
    return { html: html, titre: q.Question };
  }

  /* ==========================================================
     Porte 2 – « Je me ressource » (fiches, quiz, ressources)
     ========================================================== */
  var FICHES = DONNEES.fiches || [];
  var QUIZ = DONNEES.quiz || [];
  var RESSOURCES = DONNEES.ressources || [];
  var RUBRIQUES = (DONNEES.listes && DONNEES.listes["Rubriques ressources"]) || [];
  var DUREES = (DONNEES.listes && DONNEES.listes["Durées ressources"]) || [];

  function ficheParId(id) { return FICHES.filter(function (f) { return f.ID === id; })[0]; }
  function questionsDuQuiz(id) {
    return QUIZ.filter(function (q) { return q.Fiche === id; })
      .sort(function (a, b) { return Number(a["N°"]) - Number(b["N°"]); });
  }

  /* Markdown simple → HTML : titres ###, listes « - », gras **…**, paragraphes */
  function markdown(texte) {
    var html = "", liste = false;
    function enLigne(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
    function fermerListe() { if (liste) { html += "</ul>"; liste = false; } }
    String(texte || "").split(/\r?\n/).forEach(function (ligne) {
      var l = ligne.trim();
      if (!l) { fermerListe(); return; }
      var titre = l.match(/^#{1,6}\s+(.*)$/);
      var puce = l.match(/^[-*]\s+(.*)$/);
      if (titre) { fermerListe(); html += '<h2 class="intertitre">' + enLigne(titre[1]) + "</h2>"; }
      else if (puce) { if (!liste) { html += "<ul>"; liste = true; } html += "<li>" + enLigne(puce[1]) + "</li>"; }
      else { fermerListe(); html += "<p>" + enLigne(l) + "</p>"; }
    });
    fermerListe();
    return html;
  }

  function majuscule(t) { t = String(t || ""); return t.charAt(0).toUpperCase() + t.slice(1); }

  function carteFiche(f) {
    return '<li><a class="carte-fiche" href="#/ressources/fiche/' + esc(f.ID) + '">' +
      '<span class="carte-fiche__icone">' + icone("livre", 22) + "</span>" +
      '<span class="carte-fiche__textes"><span class="carte-fiche__titre">' + esc(f.Titre) + "</span>" +
      '<span class="discret">' + esc(f["Durée de lecture"]) + "</span></span>" +
      icone("suivant", 22, "#1e1e1c", 2.5) + "</a></li>";
  }

  function ecranRessources(params) {
    if (!params.length || !params[0]) return ecranRessourcesAccueil();
    if (params[0] === "fiche") { var f = ficheParId(params[1]); return f ? ecranFiche(f) : null; }
    if (params[0] === "quiz") { var fq = ficheParId(params[1]); return fq ? ecranQuiz(fq) : null; }
    if (params[0] === "bibliotheque") return ecranBibliotheque();
    return null;
  }

  function ecranRessourcesAccueil() {
    var porte = PORTES[1];
    var html = bandeau(porte.classe, porte.titre, porte.chapeau) +
      '<div class="page porte2">' +
        '<section class="porte2__fiches" aria-labelledby="titre-reviser">' +
          '<h2 class="intertitre" id="titre-reviser">Réviser ma formation</h2>' +
          '<p class="discret">Des fiches courtes, chacune suivie d’un quiz de 5 questions.</p>' +
          '<ul class="liste-fiches">' + FICHES.map(carteFiche).join("") + "</ul>" +
        "</section>" +
        '<div class="porte2__cote">' +
          '<section class="carte-bordee" aria-labelledby="titre-biblio">' +
            '<h2 class="intertitre" id="titre-biblio">Ressources</h2>' +
            "<p>" + RESSOURCES.length + " ressources fiables, à choisir selon votre public, votre besoin et le temps dont vous disposez.</p>" +
            '<a class="bouton bouton--plein" href="#/ressources/bibliotheque">Voir les ressources' + icone("suivant", 20, "#ffffff", 2.5) + "</a>" +
          "</section>" +
          '<a class="tuile-sombre" href="#/glossaire">' + icone("glossaire", 26, "#ffffff") +
            '<span><span class="tuile-sombre__titre">Ouvrir le glossaire</span><span>Les mots de l’IA, sans jargon</span></span>' +
            icone("suivant", 22, "#ffffff", 2.5) + "</a>" +
        "</div>" +
      "</div>";
    return { html: html, titre: porte.titre };
  }

  function ecranFiche(f) {
    var pastille = '<span class="pastille">' + icone("livre", 18) + "Réviser ma formation</span>";
    var nb = questionsDuQuiz(f.ID).length;
    var html = bandeau("ressource", f.Titre, f["Durée de lecture"], pastille) +
      '<div class="page page--etroite fiche">' +
        (f["L'essentiel"] ? '<p class="fiche__essentiel">' + esc(f["L'essentiel"]) + "</p>" : "") +
        '<div class="fiche__contenu">' + markdown(f["Contenu (Markdown)"]) + "</div>" +
        (f["À retenir"] ? '<aside class="a-retenir"><strong>À retenir&nbsp;:</strong> ' + esc(f["À retenir"]) + "</aside>" : "") +
        '<p class="source"><strong>Sources&nbsp;:</strong> ' + esc(majuscule(f.Sources)) +
          (f["Mise à jour"] ? "<br>Mise à jour&nbsp;: " + esc(f["Mise à jour"]) : "") + "</p>" +
        (nb ? '<a class="bouton bouton--plein" href="#/ressources/quiz/' + esc(f.ID) + '">Faire le quiz (' + nb + " questions)" +
          icone("suivant", 20, "#ffffff", 2.5) + "</a>" : "") +
      "</div>";
    return { html: html, titre: f.Titre };
  }

  /* --- Quiz : une question à la fois, propositions mélangées à chaque affichage --- */
  function melanger(tableau) {
    var t = tableau.slice();
    for (var i = t.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var x = t[i]; t[i] = t[j]; t[j] = x;
    }
    return t;
  }

  function ecranQuiz(f) {
    var questions = questionsDuQuiz(f.ID);
    var etat = { index: 0, score: 0 };
    var titreCourt = f.Titre.replace(/^.*?:\s*/, "");

    function enTete() {
      var fini = etat.index >= questions.length;
      var progression = fini ? 100 : Math.round(etat.index / questions.length * 100);
      return '<section class="bandeau bandeau--ressource"><div class="bandeau__dedans">' +
        boutonRetour("Retour à la fiche") +
        '<p class="quiz__nom">Quiz&nbsp;: ' + esc(titreCourt) + "</p>" +
        '<div class="quiz__progression"><div class="barre" aria-hidden="true"><div style="width:' + progression + '%"></div></div>' +
        '<span>' + (fini ? "Terminé" : "Question " + (etat.index + 1) + " sur " + questions.length) + "</span></div>" +
      "</div></section>";
    }

    function vueQuestion() {
      var q = questions[etat.index];
      var propositions = melanger(["A", "B", "C", "D"].filter(function (l) { return q["Réponse " + l]; }));
      return enTete() +
        '<div class="page page--etroite quiz">' +
          '<h1 class="quiz__question" tabindex="-1">' + esc(q.Question) + "</h1>" +
          '<div class="quiz__choix" role="group" aria-label="Propositions">' +
            propositions.map(function (l) {
              return '<button type="button" class="choix" data-lettre="' + l + '"><span class="choix__texte">' + esc(q["Réponse " + l]) + "</span>" +
                '<span class="choix__etat"></span></button>';
            }).join("") +
          "</div>" +
          '<div class="quiz__retour" data-retour-quiz role="status"></div>' +
          '<button type="button" class="bouton bouton--plein" data-suivant hidden>' +
            (etat.index + 1 < questions.length ? "Question suivante" : "Voir mon score") + icone("suivant", 20, "#ffffff", 2.5) + "</button>" +
        "</div>";
    }

    function vueScore() {
      var s = etat.score, n = questions.length;
      var message = s === n ? "Bravo, un sans-faute&nbsp;! Vous maîtrisez l’essentiel de cette fiche."
        : s >= Math.ceil(n * 0.6) ? "Beau travail&nbsp;! Vous avez retenu l’essentiel. Un coup d’œil à la fiche pour les points qui résistent&nbsp;?"
        : "C’est un bon début. Relisez la fiche tranquillement, puis retentez le quiz&nbsp;: les propositions seront dans un autre ordre.";
      return enTete() +
        '<div class="page page--etroite quiz">' +
          '<div class="score">' +
            '<span class="phare-mini">' + phare() + "</span>" +
            '<div><h1 class="titre-page" tabindex="-1">' + s + " bonne" + (s > 1 ? "s" : "") + " réponse" + (s > 1 ? "s" : "") + " sur " + n + "</h1>" +
            '<p class="chapeau">' + message + "</p></div>" +
          "</div>" +
          '<button type="button" class="bouton bouton--plein" data-recommencer>Refaire le quiz</button>' +
          '<a class="bouton bouton--contour bouton--plein" href="#/ressources/fiche/' + esc(f.ID) + '">' + icone("livre", 20) + "Relire la fiche</a>" +
          '<a class="lien-fort lien-icone" href="#/ressources">' + icone("precedent", 20, "#1e1e1c", 2.5) + "Voir les autres fiches</a>" +
        "</div>";
    }

    function dessiner(main, focaliser) {
      main.innerHTML = etat.index < questions.length ? vueQuestion() : vueScore();
      main.querySelectorAll("[data-retour]").forEach(function (b) {
        b.addEventListener("click", function () { aller("ressources/fiche/" + f.ID); });
      });
      brancher(main);
      if (focaliser) { window.scrollTo(0, 0); main.querySelector("h1").focus({ preventScroll: true }); }
    }

    function brancher(main) {
      var recommencer = main.querySelector("[data-recommencer]");
      if (recommencer) {
        recommencer.addEventListener("click", function () { etat.index = 0; etat.score = 0; dessiner(main, true); });
        return;
      }
      var q = questions[etat.index];
      var bonne = String(q["Bonne réponse"] || "").trim().toUpperCase();
      main.querySelectorAll("[data-lettre]").forEach(function (bouton) {
        bouton.addEventListener("click", function () {
          var choisie = bouton.getAttribute("data-lettre");
          var juste = choisie === bonne;
          if (juste) etat.score += 1;
          main.querySelectorAll("[data-lettre]").forEach(function (b) {
            var l = b.getAttribute("data-lettre");
            b.disabled = true;
            if (l === bonne) {
              b.classList.add("choix--juste");
              b.querySelector(".choix__etat").innerHTML = icone("coche", 22, "#1e1e1c", 3) + "<span>Bonne réponse</span>";
            } else if (l === choisie) {
              b.classList.add("choix--faux");
              b.querySelector(".choix__etat").innerHTML = icone("croix", 22, "#1e1e1c", 3) + "<span>Votre réponse</span>";
            }
          });
          main.querySelector("[data-retour-quiz]").innerHTML =
            '<div class="encadre"><p><strong>' + (juste ? "Exact&nbsp;!" : "Pas tout à fait.") + "</strong> " + esc(q.Explication) + "</p></div>";
          var suivant = main.querySelector("[data-suivant]");
          suivant.hidden = false;
          suivant.focus({ preventScroll: true });
        });
      });
      main.querySelector("[data-suivant]").addEventListener("click", function () {
        etat.index += 1;
        dessiner(main, true);
      });
    }

    return {
      html: questions.length ? vueQuestion() : "",
      titre: "Quiz : " + titreCourt,
      apres: function (main) {
        dessiner(main, false); // redessine avec un retour vers la fiche
      }
    };
  }

  /* --- Bibliothèque de ressources, filtrable par trois listes déroulantes --- */
  var PUBLICS = [
    { code: "", nom: "Tous les publics" },
    { code: "dir", nom: "Chefs d’établissement" },
    { code: "ens", nom: "Enseignants" },
    { code: "cpe", nom: "CPE et vie scolaire" }
  ];
  var filtresRessources = null; // gardés le temps de la visite

  function carteRessource(r) {
    var lien = /^https?:\/\//.test(r.Lien || "");
    var contenu =
      (r.Type ? '<span class="etiquette">' + esc(r.Type) + "</span>" : "") +
      '<span class="carte-ressource__titre">' + esc(r.Titre) + "</span>" +
      (r.Remarque ? '<span class="carte-ressource__remarque">' + esc(r.Remarque) + "</span>" : "") +
      '<dl class="infos">' +
        "<div><dt>Pour qui</dt><dd>" + esc(r["Pour qui"]) + "</dd></div>" +
        "<div><dt>Pour quoi faire</dt><dd>" + esc(r.Rubrique) + "</dd></div>" +
        "<div><dt>Durée</dt><dd>" + esc(r["Durée"]) + "</dd></div>" +
      "</dl>" +
      '<span class="discret petit">Source&nbsp;: ' + esc(r["Éditeur"]) + "</span>";
    if (lien) {
      return '<li><a class="carte-ressource" href="' + esc(r.Lien) + '" target="_blank" rel="noopener noreferrer">' + contenu +
        '<span class="carte-ressource__ouvrir">Ouvrir la ressource' + icone("externe", 18) +
        '<span class="visuellement-cache"> (nouvel onglet)</span></span></a></li>';
    }
    return '<li><div class="carte-ressource carte-ressource--sans-lien">' + contenu +
      '<span class="carte-ressource__ouvrir">Lien bientôt disponible</span></div></li>';
  }

  function ecranBibliotheque() {
    if (!filtresRessources) filtresRessources = { public: lireProfil() || "", rubrique: "", duree: "" };
    function options(liste, valeur) {
      return liste.map(function (o) {
        return '<option value="' + esc(o.code) + '"' + (o.code === valeur ? " selected" : "") + ">" + esc(o.nom) + "</option>";
      }).join("");
    }
    var html = bandeau("ressource", "Ressources", "Des ressources fiables, choisies par l’équipe de l’ISFEC.") +
      '<div class="page">' +
        '<form class="filtres" data-filtres aria-label="Filtrer les ressources">' +
          '<div class="filtre"><label for="f-public">Pour qui</label><select id="f-public" name="public">' +
            options(PUBLICS, filtresRessources.public) + "</select></div>" +
          '<div class="filtre"><label for="f-rubrique">Pour quoi faire</label><select id="f-rubrique" name="rubrique">' +
            options([{ code: "", nom: "Tout" }].concat(RUBRIQUES.map(function (r) { return { code: r, nom: r }; })), filtresRessources.rubrique) + "</select></div>" +
          '<div class="filtre"><label for="f-duree">Durée</label><select id="f-duree" name="duree">' +
            options([{ code: "", nom: "Toutes" }].concat(DUREES.map(function (d) { return { code: d, nom: d }; })), filtresRessources.duree) + "</select></div>" +
        "</form>" +
        '<p class="compte" data-compte aria-live="polite"></p>' +
        '<ul class="grille-ressources" data-liste></ul>' +
        '<div class="encadre" data-vide hidden><p><strong>Aucune ressource ne correspond à ces trois choix.</strong></p>' +
          '<button type="button" class="lien-bouton" data-effacer>Afficher toutes les ressources</button></div>' +
      "</div>";

    return {
      html: html,
      titre: "Ressources",
      apres: function (main) {
        var form = main.querySelector("[data-filtres]");
        function filtrer() {
          filtresRessources = { public: form.public.value, rubrique: form.rubrique.value, duree: form.duree.value };
          var liste = RESSOURCES.filter(function (r) {
            return (!filtresRessources.public || concerne(r, filtresRessources.public)) &&
              (!filtresRessources.rubrique || r.Rubrique === filtresRessources.rubrique) &&
              (!filtresRessources.duree || r["Durée"] === filtresRessources.duree);
          });
          main.querySelector("[data-liste]").innerHTML = liste.map(carteRessource).join("");
          main.querySelector("[data-compte]").textContent = liste.length + " ressource" + (liste.length > 1 ? "s" : "") +
            (liste.length > 1 ? " correspondent" : liste.length ? " correspond" : "") + (liste.length ? " à vos choix." : "");
          main.querySelector("[data-compte]").hidden = !liste.length;
          main.querySelector("[data-vide]").hidden = liste.length > 0;
        }
        form.addEventListener("change", filtrer);
        form.addEventListener("submit", function (e) { e.preventDefault(); });
        main.querySelector("[data-effacer]").addEventListener("click", function () {
          form.public.value = ""; form.rubrique.value = ""; form.duree.value = "";
          filtrer(); form.public.focus();
        });
        filtrer();
      }
    };
  }

  /* ==========================================================
     Glossaire : recherche et navigation par lettre
     ========================================================== */
  var GLOSSAIRE = (DONNEES.glossaire || []).slice().sort(function (a, b) {
    return normaliser(a.Mot).localeCompare(normaliser(b.Mot), "fr");
  });

  // « Fiche « Cadre d'usage » » → lien vers la fiche ; « FAQ « Usage frugal » » → recherche dans la FAQ
  function pourAllerPlusLoin(texte) {
    texte = String(texte || "").trim();
    if (!texte || texte === "–" || texte === "-") return "";
    var cible = (texte.match(/«\s*(.+?)\s*»/) || [])[1];
    if (/^fiche/i.test(texte) && cible) {
      var mots = motsCles(cible);
      var fiche = FICHES.filter(function (f) {
        var titre = " " + normaliser(f.Titre) + " ";
        return mots.every(function (m) { return trouveMot(titre, m); });
      })[0];
      if (fiche) return '<a href="#/ressources/fiche/' + esc(fiche.ID) + '">Fiche «&nbsp;' + esc(fiche.Titre) + "&nbsp;»</a>";
    }
    if (/^faq/i.test(texte) && cible) {
      return '<a href="#/questions/recherche/' + encodeURIComponent(cible) + '">Questions sur «&nbsp;' + esc(cible) + "&nbsp;»</a>";
    }
    if (/^id[ée]es? d/i.test(texte)) {
      return '<a href="#/action">' + esc(texte) + "</a>";
    }
    return esc(texte);
  }

  function premiereLettre(mot) { return normaliser(mot).charAt(0).toUpperCase(); }

  function ecranGlossaire() {
    var lettres = [];
    GLOSSAIRE.forEach(function (g) { var l = premiereLettre(g.Mot); if (lettres.indexOf(l) < 0) lettres.push(l); });

    var html = bandeau("neutre", "Glossaire", "Les mots de l’IA, expliqués simplement.") +
      '<div class="page page--etroite glossaire">' +
        '<div class="recherche"><label for="champ-mot" class="recherche__label">Chercher un mot</label>' +
          '<div class="recherche__champ">' + icone("loupe", 22, "#455259") +
          '<input id="champ-mot" type="search" autocomplete="off" placeholder="Ex.&nbsp;: hallucination"></div></div>' +
        '<nav class="lettres" aria-label="Aller à la lettre">' + lettres.map(function (l) {
          return '<button type="button" data-lettre-glossaire="' + l + '" aria-label="Lettre ' + l + '">' + l + "</button>";
        }).join("") + "</nav>" +
        '<p class="compte" data-compte-glossaire aria-live="polite"></p>' +
        '<div data-mots>' + lettres.map(function (l) {
          return '<section class="groupe-lettre" data-groupe="' + l + '"><h2 class="lettre" id="lettre-' + l + '" tabindex="-1">' + l + "</h2><dl>" +
            GLOSSAIRE.filter(function (g) { return premiereLettre(g.Mot) === l; }).map(function (g) {
              var plus = pourAllerPlusLoin(g["Pour aller plus loin"]);
              return '<div class="mot" data-texte="' + esc(normaliser(g.Mot + " " + g["Définition"])) + '">' +
                "<dt>" + esc(g.Mot) + "</dt><dd>" + esc(g["Définition"]) +
                (plus ? '<span class="mot__plus">Pour aller plus loin&nbsp;: ' + plus + "</span>" : "") + "</dd></div>";
            }).join("") + "</dl></section>";
        }).join("") + "</div>" +
        '<div class="encadre" data-aucun-mot hidden><p><strong>Ce mot n’est pas encore dans le glossaire.</strong></p>' +
          '<p>Essayez un mot plus court, ou <a href="#/questions">cherchez dans la FAQ</a>.</p></div>' +
      "</div>";

    return {
      html: html,
      titre: "Glossaire",
      apres: function (main) {
        var champ = main.querySelector("#champ-mot");
        champ.addEventListener("input", function () {
          var mots = motsCles(champ.value), visibles = 0;
          main.querySelectorAll(".mot").forEach(function (m) {
            var texte = " " + m.getAttribute("data-texte") + " ";
            var ok = mots.every(function (x) { return trouveMot(texte, x); });
            m.hidden = !ok; if (ok) visibles += 1;
          });
          main.querySelectorAll("[data-groupe]").forEach(function (g) {
            g.hidden = !g.querySelector(".mot:not([hidden])");
          });
          main.querySelector("[data-aucun-mot]").hidden = visibles > 0;
          main.querySelector("[data-compte-glossaire]").textContent = mots.length ? visibles + " mot" + (visibles > 1 ? "s" : "") + " trouvé" + (visibles > 1 ? "s" : "") + "." : "";
        });
        main.querySelectorAll("[data-lettre-glossaire]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (champ.value) { champ.value = ""; champ.dispatchEvent(new Event("input")); }
            var cible = main.querySelector("#lettre-" + b.getAttribute("data-lettre-glossaire"));
            cible.scrollIntoView({ behavior: "smooth", block: "start" });
            cible.focus({ preventScroll: true });
          });
        });
      }
    };
  }

  /* ==========================================================
     Porte 3 – « Je passe à l'action » (banque d'idées)
     ========================================================== */
  var IDEES = (DONNEES.idees || []).map(function (idee, rang) { idee._rang = rang; return idee; });
  // Coups de cœur en tête, puis l'ordre de l'Excel
  IDEES.sort(function (a, b) {
    var ca = (a["Coup de cœur"] || "").toLowerCase() === "oui" ? 0 : 1;
    var cb = (b["Coup de cœur"] || "").toLowerCase() === "oui" ? 0 : 1;
    return ca - cb || a._rang - b._rang;
  });
  var NIVEAUX = (DONNEES.listes && DONNEES.listes["Niveaux"]) || [];
  var PAR_PAGE = 12;
  var filtresIdees = null; // gardés le temps de la visite

  function ideeParId(id) { return IDEES.filter(function (i) { return i.ID === id; })[0]; }
  function estCoupDeCoeur(i) { return (i["Coup de cœur"] || "").toLowerCase() === "oui"; }
  // « 1er et 2nd degrés » répond aux deux filtres ; « Les deux » aussi pour le format
  function correspondDegre(i, choix) {
    if (!choix) return true;
    var d = normaliser(i["Degré"]);
    return d === normaliser(choix) || (/1er/.test(d) && /2nd/.test(d));
  }
  function correspondFormat(i, choix) {
    if (!choix) return true;
    var f = normaliser(i.Format);
    return f === normaliser(choix) || f === "les deux";
  }

  function etiquettesIdee(i, avecDuree) {
    return '<span class="etiquettes">' +
      (estCoupDeCoeur(i) ? '<span class="etiquette etiquette--coeur">' + icone("coeur", 14) + "Coup de cœur</span>" : "") +
      '<span class="etiquette etiquette--vert">' + esc(i.Niveau) + "</span>" +
      (i["Public (texte de la fiche)"] ? '<span class="etiquette etiquette--clair">' + esc(i["Public (texte de la fiche)"]) + "</span>" : "") +
      (i.Format ? '<span class="etiquette etiquette--clair">' + esc(i.Format === "Les deux" ? "Avec ou sans écran" : i.Format) + "</span>" : "") +
      (avecDuree && i["Durée"] ? '<span class="etiquette etiquette--clair">' + esc(i["Durée"]) + "</span>" : "") +
    "</span>";
  }

  function carteIdee(i) {
    return '<li><a class="carte-idee" href="#/action/' + esc(i.ID) + '">' +
      etiquettesIdee(i, false) +
      '<span class="carte-idee__titre">' + esc(i.Titre) + "</span>" +
      (i.Objectif ? '<span class="carte-idee__objectif">' + esc(majuscule(i.Objectif)) + "</span>" : "") +
      '<span class="carte-idee__infos">' +
        (i["Durée"] ? "<span>Durée&nbsp;: " + esc(i["Durée"]) + "</span>" : "") +
        (i["Pour qui"] ? "<span>Pour&nbsp;: " + esc(majuscule(i["Pour qui"])) + "</span>" : "") +
      "</span>" +
      '<span class="carte-idee__voir">Voir la fiche' + icone("suivant", 20, "#1e1e1c", 2.5) + "</span>" +
    "</a></li>";
  }

  function ecranAction(params) {
    if (!params.length || !params[0]) return ecranIdees();
    var i = ideeParId(params[0]);
    return i ? ecranIdee(i) : null;
  }

  function ecranIdees() {
    var porte = PORTES[2];
    if (!filtresIdees) filtresIdees = { niveau: "", degre: "", format: "", nombre: PAR_PAGE };
    function options(liste, valeur, tous) {
      return '<option value="">' + tous + "</option>" + liste.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === valeur ? " selected" : "") + ">" + esc(o) + "</option>";
      }).join("");
    }
    var html = bandeau(porte.classe, porte.titre, porte.chapeau) +
      '<div class="page">' +
        '<form class="filtres" data-filtres-idees aria-label="Filtrer les idées">' +
          '<div class="filtre"><label for="f-niveau">Niveau</label><select id="f-niveau" name="niveau">' + options(NIVEAUX, filtresIdees.niveau, "Tous") + "</select></div>" +
          '<div class="filtre"><label for="f-degre">Degré</label><select id="f-degre" name="degre">' + options(["1er degré", "2nd degré"], filtresIdees.degre, "Tous") + "</select></div>" +
          '<div class="filtre"><label for="f-format">Format</label><select id="f-format" name="format">' + options(["Débranchée", "Avec un outil numérique"], filtresIdees.format, "Tous") + "</select></div>" +
        "</form>" +
        '<p class="compte" data-compte-idees aria-live="polite"></p>' +
        '<ul class="grille-idees" data-liste-idees></ul>' +
        '<button type="button" class="bouton bouton--contour plus-idees" data-plus hidden>Voir plus d’idées</button>' +
        '<div class="encadre" data-vide-idees hidden><p><strong>Aucune idée ne correspond à ces trois choix.</strong></p>' +
          '<button type="button" class="lien-bouton" data-effacer-idees>Afficher toutes les idées</button></div>' +
      "</div>";

    return {
      html: html,
      titre: porte.titre,
      apres: function (main) {
        var form = main.querySelector("[data-filtres-idees]");
        function dessiner(focusIndex) {
          var liste = IDEES.filter(function (i) {
            return (!filtresIdees.niveau || i.Niveau === filtresIdees.niveau) &&
              correspondDegre(i, filtresIdees.degre) && correspondFormat(i, filtresIdees.format);
          });
          var visibles = liste.slice(0, filtresIdees.nombre);
          var ul = main.querySelector("[data-liste-idees]");
          ul.innerHTML = visibles.map(carteIdee).join("");
          var n = liste.length;
          main.querySelector("[data-compte-idees]").textContent = n ? n + " idée" + (n > 1 ? "s" : "") +
            (n > visibles.length ? " (" + visibles.length + " affichées)" : "") + ", coups de cœur en tête." : "";
          main.querySelector("[data-plus]").hidden = n <= visibles.length;
          main.querySelector("[data-vide-idees]").hidden = n > 0;
          if (typeof focusIndex === "number") {
            var lien = ul.querySelectorAll("a")[focusIndex];
            if (lien) lien.focus();
          }
        }
        form.addEventListener("change", function () {
          filtresIdees = { niveau: form.niveau.value, degre: form.degre.value, format: form.format.value, nombre: PAR_PAGE };
          dessiner();
        });
        form.addEventListener("submit", function (e) { e.preventDefault(); });
        main.querySelector("[data-plus]").addEventListener("click", function () {
          var avant = filtresIdees.nombre;
          filtresIdees.nombre += PAR_PAGE;
          dessiner(avant); // le focus va sur la première nouvelle idée
        });
        main.querySelector("[data-effacer-idees]").addEventListener("click", function () {
          form.niveau.value = ""; form.degre.value = ""; form.format.value = "";
          filtresIdees = { niveau: "", degre: "", format: "", nombre: PAR_PAGE };
          dessiner(); form.niveau.focus();
        });
        dessiner();
      }
    };
  }

  function etapes(texte) {
    var lignes = String(texte || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    return '<ol class="etapes">' + lignes.map(function (l, n) {
      return '<li><span class="etapes__num" aria-hidden="true">' + (n + 1) + "</span><span>" +
        esc(majuscule(l.replace(/^\d+\s*[.)–-]\s*/, ""))) + "</span></li>";
    }).join("") + "</ol>";
  }

  function rubriqueIdee(titre, nomIcone, contenu) {
    if (!contenu) return "";
    return '<section class="rubrique-idee"><h2 class="intertitre"><span class="rubrique-idee__icone">' + icone(nomIcone, 18) + "</span>" +
      esc(titre) + "</h2>" + contenu + "</section>";
  }

  function ecranIdee(i) {
    var publicTexte = [i["Pour qui"], i["Public (texte de la fiche)"]].filter(Boolean).map(majuscule).join(" · ");
    var html = bandeau("action", i.Titre, "", etiquettesIdee(i, true)) +
      '<div class="page page--etroite idee">' +
        rubriqueIdee("Objectif", "cible", i.Objectif ? "<p>" + esc(majuscule(i.Objectif)) + "</p>" : "") +
        rubriqueIdee("Public", "groupe", publicTexte ? "<p>" + esc(publicTexte) + "</p>" : "") +
        rubriqueIdee("Étapes", "liste", i["Étapes"] ? etapes(i["Étapes"]) : "") +
        rubriqueIdee("Moyens", "outils", i.Moyens ? "<p>" + esc(majuscule(i.Moyens)) + "</p>" : "") +
        rubriqueIdee("Indicateur de réussite", "coche", i["Indicateur de réussite"] ? "<p>" + esc(majuscule(i["Indicateur de réussite"])) + "</p>" : "") +
        (i["Point de vigilance"] ? '<aside class="vigilance">' + icone("alerte", 24) +
          "<p><strong>Point de vigilance&nbsp;:</strong> " + esc(i["Point de vigilance"]) + "</p></aside>" : "") +
        (i["Mise à jour"] ? '<p class="source">Mise à jour&nbsp;: ' + esc(i["Mise à jour"]) + "</p>" : "") +
        '<a class="lien-fort lien-icone" href="#/action">' + icone("precedent", 20, "#1e1e1c", 2.5) + "Voir les autres idées</a>" +
      "</div>";
    return { html: html, titre: i.Titre };
  }

  /* ==========================================================
     Aide et confidentialité
     ========================================================== */
  function ecranAide() {
    var html = bandeau("neutre", "Comment ça marche ?", "Phare IA prolonge votre formation : trois portes, et tout se trouve en trois gestes.") +
      '<div class="page page--etroite pages-texte">' +
        '<section aria-labelledby="aide-portes"><h2 class="intertitre" id="aide-portes">Les trois portes</h2>' +
          '<ul class="liste-portes">' +
            '<li><a href="#/questions"><span class="pastille-porte pastille-porte--question">' + icone("question", 22) + "</span>" +
              "<span><strong>J’ai une question</strong><span>Cherchez une réponse dans la FAQ, par mot-clé ou par thème.</span></span></a></li>" +
            '<li><a href="#/ressources"><span class="pastille-porte pastille-porte--ressource">' + icone("livre", 22) + "</span>" +
              "<span><strong>Je me ressource</strong><span>Révisez la formation avec des fiches et des quiz, et trouvez des ressources fiables.</span></span></a></li>" +
            '<li><a href="#/action"><span class="pastille-porte pastille-porte--action">' + icone("ampoule", 22) + "</span>" +
              "<span><strong>Je passe à l’action</strong><span>Trouvez des idées de projets pour l’établissement, la classe ou la vie scolaire.</span></span></a></li>" +
          "</ul></section>" +
        '<section aria-labelledby="aide-profil"><h2 class="intertitre" id="aide-profil">Changer de profil</h2>' +
          "<p>Votre profil adapte les questions fréquentes et les exemples. Vous pouvez le modifier à tout moment.</p>" +
          '<a class="bouton bouton--contour" href="#/profil">' + icone("groupe", 20) + "Changer de profil</a></section>" +
        '<section aria-labelledby="aide-portee"><h2 class="intertitre" id="aide-portee">Garder Phare IA à portée de main</h2>' +
          "<p>Sur votre téléphone, ouvrez le menu du navigateur et choisissez «&nbsp;Ajouter à l’écran d’accueil&nbsp;». Phare IA apparaîtra comme une application.</p></section>" +
        '<section aria-labelledby="aide-contact"><h2 class="intertitre" id="aide-contact">Une question sur l’appli&nbsp;?</h2>' +
          '<p>Écrivez à l’équipe de l’ISFEC&nbsp;: <a href="mailto:pedagogienumerique@isfecfrancoisdassise.fr">pedagogienumerique@isfecfrancoisdassise.fr</a></p></section>' +
      "</div>";
    return { html: html, titre: "Aide" };
  }

  function ecranConfidentialite() {
    var profil = lireProfil();
    var html = bandeau("neutre", "Confidentialité", "Vos données, expliquées simplement.") +
      '<div class="page page--etroite pages-texte">' +
        '<aside class="encadre encadre--phare"><span class="phare-mini">' + phare() + "</span>" +
          "<p><strong>En bref&nbsp;: Phare IA ne sait pas qui vous êtes, et c’est voulu.</strong></p></aside>" +
        '<section aria-labelledby="conf-1"><h2 class="intertitre" id="conf-1">Ce que Phare IA ne collecte pas</h2>' +
          "<p>Aucun compte, aucun nom, aucune adresse e-mail, aucune statistique de visite. Phare IA n’utilise aucune intelligence artificielle&nbsp;: vos recherches restent sur votre appareil.</p></section>" +
        '<section aria-labelledby="conf-2"><h2 class="intertitre" id="conf-2">Ce qui reste sur votre appareil</h2>' +
          "<p>Seulement le profil que vous avez choisi, pour adapter les exemples. Pour l’effacer, changez de profil ou effacez les données du site dans votre navigateur.</p>" +
          (profil ? '<button type="button" class="bouton bouton--contour" data-oublier>Effacer mon profil de cet appareil</button>' : "") +
        "</section>" +
        '<section aria-labelledby="conf-3"><h2 class="intertitre" id="conf-3">Quand vous proposez une question</h2>' +
          "<p>Le bouton «&nbsp;Proposer une question&nbsp;» ouvre un formulaire Microsoft Forms anonyme, géré par l’ISFEC. Les questions servent uniquement à enrichir la FAQ. N’y indiquez aucun nom d’élève, de famille ou de collègue.</p></section>" +
        '<p class="source">Mise à jour&nbsp;: ' + esc(window.PHARE_VERSION || "") + "</p>" +
      "</div>";
    return {
      html: html,
      titre: "Confidentialité",
      apres: function (main) {
        var b = main.querySelector("[data-oublier]");
        if (!b) return;
        b.addEventListener("click", function () {
          profilMemoire = null;
          try { window.localStorage.removeItem(CLE_PROFIL); } catch (e) { /* rien à effacer */ }
          b.outerHTML = '<p class="message-ok" role="status">C’est fait&nbsp;: votre profil est effacé de cet appareil. Il vous sera demandé à la prochaine ouverture.</p>';
        });
      }
    };
  }

  var ECRANS = {
    profil: ecranProfil,
    accueil: ecranAccueil,
    questions: ecranQuestions,
    ressources: ecranRessources,
    action: ecranAction,
    glossaire: ecranGlossaire,
    aide: ecranAide,
    confidentialite: ecranConfidentialite
  };

  /* ==========================================================
     Aiguillage entre les écrans
     ========================================================== */
  /* « #/questions/FAQ22 » → ["questions", "FAQ22"] */
  function routeCourante() {
    return (window.location.hash || "").replace(/^#\/?/, "").split("/").map(function (morceau) {
      try { return decodeURIComponent(morceau); } catch (e) { return morceau; }
    });
  }

  function aller(route, remplacer) {
    var cible = "#/" + route;
    if (remplacer) { window.history.replaceState(null, "", cible); afficher(); }
    else if (window.location.hash === cible) { afficher(); }
    else { window.location.hash = cible; }
  }

  function annoncer(message) {
    var zone = document.querySelector("[data-annonce]");
    zone.textContent = "";
    window.setTimeout(function () { zone.textContent = message; }, 50);
  }

  var premierAffichage = true;
  function afficher() {
    var morceaux = routeCourante();
    var route = morceaux[0];
    // Première visite : on demande le profil avant tout
    if (!lireProfil() && route !== "profil" && route !== "confidentialite" && route !== "aide") {
      aller("profil", true);
      return;
    }
    if (!ECRANS[route]) { aller(lireProfil() ? "accueil" : "profil", true); return; }

    nbEcrans += 1;
    var ecran = ECRANS[route](morceaux.slice(1));
    if (!ecran) { aller(route, true); return; } // adresse inconnue dans une porte : retour à la porte
    var main = document.getElementById("contenu");
    main.innerHTML = ecran.html;

    document.body.classList.toggle("sans-nav", !!ecran.sansNav);
    document.querySelector("[data-mosaique]").hidden = !ecran.mosaique;
    document.querySelector("[data-pied]").hidden = !!ecran.sansNav;
    dessinerNavigation(route);
    document.title = ecran.titre + " – Phare IA";

    main.querySelectorAll("[data-retour]").forEach(function (b) { b.addEventListener("click", retour); });
    if (ecran.apres) ecran.apres(main);
    if (ecran.annonce) annoncer(ecran.annonce);

    // On remonte en haut et on place le lecteur d'écran sur le titre (sauf au tout premier affichage)
    window.scrollTo(0, 0);
    if (!premierAffichage) {
      var titre = main.querySelector("h1");
      (titre || main).focus({ preventScroll: true });
    }
    premierAffichage = false;
  }

  // Lien d'évitement « Aller au contenu » : on place le focus sans changer d'écran
  document.getElementById("lien-evitement").addEventListener("click", function (e) {
    e.preventDefault();
    var main = document.getElementById("contenu");
    (main.querySelector("h1") || main).focus();
  });

  window.addEventListener("hashchange", afficher);
  afficher();
})();

</script>
</body>
</html>
