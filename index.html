tations l’IA fait bien, lesquelles demandent un regard expert humain ?","Moyens":"un outil d’IA autorisé, un document.","Indicateur de réussite":"le document adapté est utilisé en classe.","Point de vigilance":"l’adaptation pour un élève à besoins particuliers reste une décision pédagogique humaine, en lien avec les dispositifs existants.","Mise à jour":""},{"ID":"I20","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Corriger avec et sans IA","Public (texte de la fiche)":"2nd degré","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"enseignants","Objectif":"tester ce qu’un appui de l’IA apporte vraiment à la correction, et ce qu’il manque.","Étapes":"1. Choisir cinq à huit productions d’élèves issues d’une même tâche, et les anonymiser rigoureusement.\n2. Les corriger comme d’habitude, sans outil.\n3. Soumettre ensuite les mêmes productions à un outil autorisé, avec une consigne précise.\n4. Comparer : qu’a-t-il vu ? Qu’a-t-il manqué ? Ses retours sont-ils utiles aux élèves ?","Moyens":"un outil d’IA autorisé par l’établissement, quelques copies anonymisées.","Indicateur de réussite":"chacun sait dire pour quelle partie de la correction l’IA est utile, ou pas.","Point de vigilance":"anonymisation rigoureuse. La note et l’appréciation restent la responsabilité du professeur.","Mise à jour":""},{"ID":"I21","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Évaluer un outil avant de l’adopter","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"enseignants et personnels éducatifs","Objectif":"apprendre à juger un outil d’IA selon trois critères, utilité, facilité d’usage et acceptabilité, avant de l’utiliser régulièrement.","Étapes":"1. Chacun choisit un outil qu’il envisage d’utiliser.\n2. Vérification préalable : peut-on le tester gratuitement ? Semble-t-il conforme au RGPD et à l’AI Act ? Est-il utilisable dans l’établissement ? Si une condition manque, on s’arrête là.\n3. Test sur une tâche réelle : est-il utile ? Facile à prendre en main ? Acceptable pour les élèves, les familles, l’équipe ?\n4. Partage des analyses et décision : adopter, tester encore ou renoncer.","Moyens":"une grille à trois critères, l’outil à tester.","Indicateur de réussite":"chaque outil testé reçoit une décision argumentée.","Point de vigilance":"toute adoption à l’échelle de l’établissement passe par la direction et le DPO.","Mise à jour":""},{"ID":"I22","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Ma première consigne réutilisable","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"enseignants et personnels éducatifs","Objectif":"rédiger une consigne complète et réutilisable pour une tâche qui revient souvent dans sa pratique.","Étapes":"1. Chacun choisit une tâche récurrente et chronophage : exercices différenciés, retours sur des brouillons, supports de révision.\n2. Il rédige une consigne détaillée : rôle de l’outil, contexte scolaire (niveau, programme), étapes, contraintes, format attendu.\n3. Il la teste, l’ajuste selon le résultat, puis la partage avec le groupe.\n4. L’équipe constitue une petite bibliothèque de consignes partagées.","Moyens":"un outil d’IA autorisé, un document partagé.","Indicateur de réussite":"chaque participant réutilise sa consigne au moins trois fois.","Point de vigilance":"aucune donnée personnelle dans la consigne. Relire chaque résultat, même avec une consigne éprouvée.","Mise à jour":""},{"ID":"I23","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Créer une ressource libre","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"2 h","Pour qui":"enseignants et personnels éducatifs","Objectif":"créer un petit outil pédagogique avec l’aide de l’IA (« vibe coding »), le tester et le partager librement.","Étapes":"1. Question préalable : existe-t-il déjà un outil ou un jeu qui répond au même besoin ? Si oui, mieux vaut l’adapter.\n2. Si la création est justifiée : définir le but, dessiner une maquette même sur papier, lister les fonctions de la plus essentielle à la moins importante.\n3. Faire produire une première version par l’IA, puis tester et corriger étape par étape.\n4. Faire tester l’outil par des collègues, l’ajuster, rédiger un court mode d’emploi.\n5. Le partager, par exemple sur la Forge des communs numériques éducatifs.","Moyens":"un outil d’IA autorisé, 2 h, des testeurs.","Indicateur de réussite":"l’outil est utilisé par au moins un autre collègue.","Point de vigilance":"commencer tout petit. C’est exactement la démarche de Phare IA !","Mise à jour":""},{"ID":"I24","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Construire une progression du CP à la 6e","Public (texte de la fiche)":"1er degré et collège","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"2 h","Pour qui":"enseignants de cycles 2 et 3, professeur documentaliste, en réunion inter-degrés","Objectif":"construire une progression cohérente sur la culture de l’IA, de l’école à la 6e.","Étapes":"1. Chaque groupe de niveau liste ce qui se fait ou pourrait se faire : activités débranchées, observation critique de productions générées.\n2. Mise en commun en plénière.\n3. On répartit les notions par niveau, sans redites ni trous.\n4. On formalise une progression simple, partagée entre l’école et le collège.","Moyens":"2 h, un tableau à double entrée (niveaux et notions).","Indicateur de réussite":"une progression écrite et validée par les deux degrés.","Point de vigilance":"au 1er degré, toujours sans manipulation d’IA générative par les élèves.","Mise à jour":""},{"ID":"I25","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Déconstruire pour comprendre","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"enseignants et personnels éducatifs","Objectif":"analyser des consignes données à une IA pour comprendre ce qui les rend efficaces ou décevantes.","Étapes":"1. Chacun apporte des consignes déjà utilisées : certaines efficaces, d’autres décevantes.\n2. En petits groupes, on les passe au crible : le rôle est-il défini ? Le contexte est-il explicite ? Le format attendu est-il précisé ?\n3. On reformule les consignes décevantes et on compare les nouveaux résultats.\n4. Le groupe formule ses principes communs.","Moyens":"les consignes de chacun, un outil d’IA autorisé.","Indicateur de réussite":"une liste de principes partagés, cohérente avec la méthode RACE.","Point de vigilance":"retirer toute donnée personnelle des consignes apportées.","Mise à jour":""},{"ID":"I26","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"La grille du lecteur critique","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"enseignants et personnels éducatifs","Objectif":"construire ensemble une grille courte pour analyser une réponse d’IA, utilisable ensuite en classe.","Étapes":"1. En amont, chacun pose une question de sa discipline à une IA et garde la réponse.\n2. En réunion, analyse collective : quelles affirmations vérifier, et avec quelle source ? Que manque-t-il ? Quel point de vue implicite ? Est-ce adapté au niveau visé ?\n3. Le groupe construit une grille de quatre à six critères.\n4. Chacun prévoit comment l’utiliser avec ses élèves (à partir de la 4e).","Moyens":"les réponses collectées, 1 h.","Indicateur de réussite":"la grille est utilisée dans au moins deux disciplines.","Point de vigilance":"une grille courte sera utilisée, une grille longue sera oubliée.","Mise à jour":""},{"ID":"I27","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Concevoir une séance de découverte","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"1 h 30","Pour qui":"enseignants et personnels éducatifs","Objectif":"concevoir une séance de découverte de l’IA adaptée au niveau de ses élèves.","Étapes":"1. Chacun se pose trois questions : qu’ont déjà fait mes élèves sur ce sujet ? Que croient-ils savoir à tort ? Quelle est la prochaine compétence à construire ?\n2. En groupes de niveau, conception d’une séance.\n3. Les autres groupes vérifient ce que la séance suppose comme acquis.\n4. Chacun repart avec une séance prête à tester.","Moyens":"la progression de l’établissement si elle existe, 1 h 30.","Indicateur de réussite":"la séance est testée en classe dans le trimestre.","Point de vigilance":"respecter le cadre d’usage selon l’âge des élèves.","Mise à jour":""},{"ID":"I05","Coup de cœur":"Non","Niveau":"Classe","Titre":"L’IA, coéquipière d’idées et de relecture","Public (texte de la fiche)":"À partir de la 4e","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"élèves, accompagnés par leur professeur","Objectif":"utiliser une IA pour trouver des idées et relire un écrit, puis analyser ses propositions avec le professeur, pour apprendre à s’en servir avec un regard critique.","Étapes":"1. Chaque élève écrit d’abord seul un premier jet ou une liste d’idées sur un sujet du cours.\n2. Par binômes, les élèves demandent à l’IA des idées complémentaires ou une relecture, avec une consigne préparée ensemble en classe (méthode RACE).\n3. Ils trient les suggestions : ce qu’ils gardent, ce qu’ils écartent, et pourquoi.\n4. Avec le professeur, la classe discute : ce que l’IA a bien vu, ce qu’elle a manqué, ce qu’elle ne pouvait pas savoir de la classe.\n5. Chaque élève améliore son texte et note en une phrase ce que l’IA lui a apporté.","Moyens":"une heure de cours, un outil d’IA autorisé par l’établissement, un vidéoprojecteur.","Indicateur de réussite":"chaque élève sait justifier au moins une suggestion de l’IA qu’il a écartée.","Point de vigilance":"l’IA propose, l’élève choisit, le professeur éclaire. Le seul expert de la discipline, qui connaît ses élèves et leurs difficultés, c’est le professeur. Aucune donnée personnelle dans les demandes.","Mise à jour":""},{"ID":"I06","Coup de cœur":"Non","Niveau":"Classe","Titre":"Partir du besoin, pas de l’outil","Public (texte de la fiche)":"Du cycle 3 au lycée","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"élèves","Objectif":"apprendre à se demander de quoi on a vraiment besoin avant de choisir un outil, numérique ou non.","Étapes":"1. Le professeur donne une tâche concrète sans imposer d’outil : écrire un texte, résoudre un problème, préparer un exposé.\n2. Par groupes, les élèves listent tous les outils possibles : manuel, dictionnaire, carte mentale sur papier, outil numérique, IA…\n3. Pour chacun, trois questions : à quoi sert-il vraiment ici ? Est-il facile à utiliser ? Est-il adapté à la classe ?\n4. Mise en commun, puis chaque élève formule avec ses mots les questions à se poser avant d’utiliser un outil.","Moyens":"45 min, une grille de questions par groupe.","Indicateur de réussite":"la classe produit une liste de questions qu’elle affiche et réutilise.","Point de vigilance":"au 1er degré, on parle de l’IA sans la manipuler. L’objectif n’est pas de choisir l’IA, mais de choisir en connaissance de cause.","Mise à jour":""},{"ID":"I07","Coup de cœur":"Non","Niveau":"Classe","Titre":"Poser la bonne question","Public (texte de la fiche)":"Cycle 3 (CM1, CM2, 6e)","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"élèves","Objectif":"comprendre qu’une question précise appelle une réponse utile, qu’on s’adresse à un camarade, à un adulte ou à une machine.","Étapes":"1. Chaque élève écrit une question sur un sujet du programme, sans contrainte.\n2. Par groupes, les élèves comparent trois questions plus ou moins précises : que sait déjà celui qui la pose ? Que cherche-t-il vraiment ? Que devrait contenir une bonne réponse ?\n3. Chacun réécrit sa question de départ, puis on compare les deux versions.\n4. Conclusion : une bonne question montre qu’on a déjà réfléchi.","Moyens":"45 min, des questions préparées par le professeur.","Indicateur de réussite":"la question réécrite de chaque élève est plus précise que la première.","Point de vigilance":"c’est une première approche du prompt, sans écran. Faites le lien avec l’IA seulement à la fin.","Mise à jour":""},{"ID":"I08","Coup de cœur":"Non","Niveau":"Classe","Titre":"Comment une machine apprend-elle ?","Public (texte de la fiche)":"Cycle 2 (CP, CE1, CE2)","Degré":"1er degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"élèves","Objectif":"comprendre, par le jeu, qu’une machine apprend à partir d’exemples, et qu’elle se trompe quand les exemples sont mal choisis.","Étapes":"1. Un élève joue la « machine » : on lui montre des cartes-images en lui disant « chat » ou « pas chat », sans lui expliquer la règle.\n2. On lui présente de nouvelles cartes : la « machine » doit deviner.\n3. On recommence avec des exemples incomplets (par exemple, uniquement des chats noirs) et on observe ses erreurs.\n4. Discussion : de quoi la machine a-t-elle besoin pour bien apprendre ? Pourquoi s’est-elle trompée ?","Moyens":"un jeu de cartes-images imprimées.","Indicateur de réussite":"les élèves expliquent avec leurs mots qu’une machine « apprend » grâce aux exemples qu’on lui donne.","Point de vigilance":"aucune manipulation d’IA générative. Évitez de dire que la machine « réfléchit » : elle reproduit ce qu’on lui a montré.","Mise à jour":""},{"ID":"I28","Coup de cœur":"Non","Niveau":"Classe","Titre":"Le jeu de Nim : la machine ne se trompe jamais","Public (texte de la fiche)":"Cycle 3 (CM1, CM2, 6e)","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"40 min","Pour qui":"élèves","Objectif":"comprendre qu’une machine suit et reproduit une règle, sans réfléchir.","Étapes":"1. Par binômes, les élèves jouent au jeu de Nim : 15 allumettes, chacun en retire 1, 2 ou 3 à son tour, celui qui prend la dernière a perdu.\n2. Le professeur entre dans le jeu avec une stratégie secrète et gagne à chaque fois. La classe cherche son « truc ».\n3. Révélation : il laisse toujours un multiple de 4 à son adversaire. Un programme fait pareil : il applique une règle.\n4. Anecdote : dès 1940, une machine appelée Nimatron battait le public, ralentie exprès pour faire croire qu’elle réfléchissait.\n5. Débat : la machine comprend-elle le jeu ? Suivre une règle, est-ce comprendre ?","Moyens":"des allumettes ou des jetons.","Indicateur de réussite":"les élèves distinguent avec leurs mots « suivre une règle » et « comprendre ».","Point de vigilance":"aucune manipulation d’IA générative. Le lien avec les IA d’aujourd’hui se fait à l’oral.","Mise à jour":""},{"ID":"I29","Coup de cœur":"Non","Niveau":"Classe","Titre":"Dis-le autrement","Public (texte de la fiche)":"Cycle 3 (CM1, CM2, 6e)","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"élèves","Objectif":"comprendre qu’une même information peut se dire de plusieurs façons, et que choisir la bonne formulation selon son interlocuteur est une compétence.","Étapes":"1. Le professeur formule une notion de trois façons au tableau : une définition de dictionnaire, une explication simple, un exemple du quotidien. Laquelle comprend-on le mieux ?\n2. Par groupes, les élèves formulent une autre notion pour trois destinataires : un élève de CP, un camarade, un adulte qui ne connaît pas le sujet.\n3. Lecture des versions.\n4. Conclusion : une IA peut, elle aussi, produire plusieurs versions selon la consigne. Savoir choisir la bonne, c’est notre travail.","Moyens":"papier, tableau.","Indicateur de réussite":"chaque groupe produit trois versions réellement adaptées à leur destinataire.","Point de vigilance":"le travail se fait sans outil numérique.","Mise à jour":""},{"ID":"I30","Coup de cœur":"Non","Niveau":"Classe","Titre":"Vrai, vraisemblable ou faux ?","Public (texte de la fiche)":"De la 6e au lycée","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée (textes préparés par le professeur)","Durée":"1 h","Pour qui":"élèves","Objectif":"distinguer une information exacte d’une information seulement vraisemblable, et prendre le réflexe de vérifier.","Étapes":"1. Le professeur distribue trois textes bien rédigés, présentés comme des réponses d’IA. Les élèves soulignent ce qui leur semble douteux.\n2. Par groupes, ils vérifient avec des sources fournies : manuel, article, fiche documentaire.\n3. Ils classent chaque affirmation : exacte, invérifiable avec ces sources, ou fausse.\n4. Mise en commun : une information bien formulée n’est pas forcément une information vraie.","Moyens":"trois textes préparés, des sources de référence.","Indicateur de réussite":"chaque groupe repère au moins une erreur et justifie avec une source.","Point de vigilance":"en 6e et 5e, les textes sont préparés par le professeur, sans manipulation par les élèves.","Mise à jour":""},{"ID":"I31","Coup de cœur":"Non","Niveau":"Classe","Titre":"La carte du savoir","Public (texte de la fiche)":"Du cycle 3 au lycée","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"30 min","Pour qui":"élèves","Objectif":"apprendre à repérer soi-même ce qu’on a compris, ce qui résiste et ce qu’on veut approfondir.","Étapes":"1. En fin de séquence, chaque élève remplit une feuille en trois colonnes : « Ce que je sais expliquer », « Ce que je comprends sans savoir l’expliquer », « Ce que je n’ai pas compris ».\n2. En binômes, chacun explique à l’autre un point de sa première colonne.\n3. Le professeur recueille les troisièmes colonnes pour ajuster la suite.","Moyens":"une feuille par élève.","Indicateur de réussite":"les élèves savent formuler précisément ce qui leur résiste.","Point de vigilance":"c’est un outil de métacognition, qui rend le raisonnement visible, pas une évaluation notée.","Mise à jour":""},{"ID":"I32","Coup de cœur":"Non","Niveau":"Classe","Titre":"À chacun son parcours","Public (texte de la fiche)":"À partir du CM2","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Supports préparés par le professeur avec une IA","Durée":"1 h","Pour qui":"élèves","Objectif":"vivre un parcours différencié vers un même objectif, et comprendre que différencier, c’est adapter le chemin, pas l’objectif.","Étapes":"1. Le professeur présente un même objectif à toute la classe et distribue trois versions d’un support, préparées en amont avec une IA puis relues : guidée, standard, enrichie.\n2. Chaque élève reçoit la version adaptée à son moment, sans jugement de valeur.\n3. Le professeur circule, observe et ajuste en temps réel.\n4. Bilan : tous ont travaillé le même objectif, par des chemins différents.","Moyens":"trois versions d’un support, relues par le professeur.","Indicateur de réussite":"la majorité des élèves atteint l’objectif commun.","Point de vigilance":"les élèves ne manipulent pas l’IA. Les ajustements en temps réel sont l’affaire du professeur, que l’IA ne remplace pas.","Mise à jour":""},{"ID":"I33","Coup de cœur":"Non","Niveau":"Classe","Titre":"La grille avant la copie","Public (texte de la fiche)":"De la 4e au lycée","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"30 min","Pour qui":"élèves","Objectif":"faire construire aux élèves les critères d’évaluation avant de réaliser une production.","Étapes":"1. Le professeur donne le sujet et la consigne, sans autre indication.\n2. En petits groupes, les élèves listent ce que le professeur va évaluer, selon eux, et pourquoi.\n3. Mise en commun : le professeur complète, précise et explique ses choix.\n4. La grille coconstruite est distribuée avant la production.","Moyens":"un sujet de production, un tableau.","Indicateur de réussite":"les élèves s’appuient sur la grille pendant la production.","Point de vigilance":"inclure un critère sur la démarche, pas seulement sur le résultat.","Mise à jour":""},{"ID":"I34","Coup de cœur":"Non","Niveau":"Classe","Titre":"Contribuer à la charte de l’établissement","Public (texte de la fiche)":"À partir de la 4e","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"2 séances de 1 h","Pour qui":"élèves","Objectif":"permettre aux élèves de contribuer à la charte d’usage de l’IA de leur établissement.","Étapes":"1. Le professeur présente les quatre repères du cadre national : éthiques, pédagogiques, juridiques, environnementaux.\n2. Par groupes, les élèves examinent des situations concrètes (rédiger un devoir avec une IA, générer une image pour un exposé, utiliser un outil non autorisé) et proposent une règle simple pour chacune.\n3. Débat en classe et choix de cinq principes, couvrant les quatre repères.\n4. Transmission au chef d’établissement ou au groupe charte ; la classe sera informée des suites.","Moyens":"des situations préparées, deux heures.","Indicateur de réussite":"au moins une proposition des élèves figure dans la charte finale.","Point de vigilance":"tenir l’engagement d’informer la classe des suites données.","Mise à jour":""},{"ID":"I35","Coup de cœur":"Non","Niveau":"Classe","Titre":"L’IA, une ressource dans la séquence","Public (texte de la fiche)":"À partir de la 4e","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"élèves","Objectif":"tester les différents rôles qu’une IA peut jouer dans une séquence, et en juger la pertinence.","Étapes":"1. Par groupes, les élèves écrivent d’abord ce qu’ils savent du sujet et les questions qu’ils se posent.\n2. Chaque groupe soumet une question à une IA et analyse la réponse : correspond-elle à ce qu’on cherchait ? Que faut-il vérifier ? Que n’a-t-elle pas su faire ?\n3. On compare entre groupes : la réponse change-t-elle selon la formulation ?\n4. Bilan : informer, inspirer, dérouter, confirmer… Plus on arrive avec une pensée construite, plus l’échange est productif.","Moyens":"un outil d’IA autorisé, une heure.","Indicateur de réussite":"les élèves situent leurs usages entre consommation passive et engagement actif.","Point de vigilance":"la réflexion personnelle vient toujours avant la question posée à l’IA.","Mise à jour":""},{"ID":"I36","Coup de cœur":"Non","Niveau":"Classe","Titre":"Évaluer le chemin, pas l’arrivée","Public (texte de la fiche)":"À partir de la 4e","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (deuxième séance)","Durée":"2 séances (45 min et 1 h)","Pour qui":"élèves","Objectif":"comparer ce que révèle une évaluation de la démarche quand on travaille avec ou sans IA.","Étapes":"1. Séance 1, sans IA : avant une tâche complexe, chaque élève note ce qu’il sait, ses questions, sa façon de procéder. Il réalise la tâche en notant ses tâtonnements, puis fait un bilan.\n2. Séance 2, avec IA : même structure sur une tâche comparable. L’élève garde la trace de ses demandes à l’IA, des réponses et de ses ajustements.\n3. Mise en commun : qu’est-ce qui a été plus facile avec l’IA ? Moins visible ? Moins maîtrisé ?\n4. Conclusion : ce qui compte, c’est de pouvoir rendre compte de sa propre pensée.","Moyens":"un carnet de bord par élève, un outil d’IA autorisé.","Indicateur de réussite":"les élèves décrivent ce que l’IA a changé dans leur façon de penser.","Point de vigilance":"la séance sans IA vient toujours en premier.","Mise à jour":""},{"ID":"I37","Coup de cœur":"Non","Niveau":"Classe","Titre":"L’IA a-t-elle des préjugés ?","Public (texte de la fiche)":"De la 4e au lycée","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (démonstration par le professeur)","Durée":"1 h","Pour qui":"élèves","Objectif":"percevoir que les réponses d’une IA ne sont pas neutres et reflètent des choix implicites.","Étapes":"1. Le professeur soumet trois consignes à une IA et projette les réponses : « Décris le quotidien d’une personne qui travaille dans la santé », « Cite les dix plus grands philosophes », « Donne un exemple de famille ».\n2. Les élèves notent ce qui les surprend, ce qui leur semble évident, ce qui manque.\n3. En groupes : quels choix le modèle a-t-il faits sans qu’on le lui demande ? Reflètent-ils une culture, une époque, une langue ?\n4. Comparaison avec un second modèle, puis introduction de la notion de biais.","Moyens":"un vidéoprojecteur, deux outils d’IA autorisés.","Indicateur de réussite":"les élèves expliquent d’où peut venir un biais.","Point de vigilance":"les sujets sensibles (familles, genre) demandent un débat bien cadré et respectueux.","Mise à jour":""},{"ID":"I38","Coup de cœur":"Non","Niveau":"Classe","Titre":"L’IA comme contradicteur","Public (texte de la fiche)":"De la 4e au lycée (sciences, histoire-géographie, EMC)","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"élèves","Objectif":"utiliser l’IA pour tester et renforcer son propre raisonnement, plutôt que pour obtenir une réponse.","Étapes":"1. Le professeur pose une question ouverte liée à la séquence : une hypothèse à défendre, une thèse à argumenter.\n2. Chaque élève rédige d’abord sa propre réponse, sans outil, en dix minutes.\n3. Il soumet à l’IA non pas la question, mais sa réponse, en lui demandant de la contredire et d’en pointer les faiblesses.\n4. Il trie les objections, consolide ses arguments et réécrit sa réponse.\n5. Mise en commun : quelles objections étaient pertinentes ? Lesquelles étaient fausses ?","Moyens":"un outil d’IA autorisé.","Indicateur de réussite":"la deuxième version de la réponse est mieux argumentée que la première.","Point de vigilance":"l’élève reste juge des objections. L’IA peut se tromper, elle aussi.","Mise à jour":""},{"ID":"I39","Coup de cœur":"Non","Niveau":"Classe","Titre":"L’IA face aux données","Public (texte de la fiche)":"De la 4e au lycée (mathématiques, sciences, géographie)","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"1 h","Pour qui":"élèves","Objectif":"utiliser l’IA pour proposer des hypothèses sur des données, que les élèves vérifient et critiquent.","Étapes":"1. Le professeur présente des données sans interprétation : graphique climatique, tableau démographique, résultats d’expérience.\n2. En binômes, les élèves proposent d’abord leur propre lecture.\n3. Ils demandent ensuite à l’IA trois hypothèses d’interprétation.\n4. Ils vérifient chaque hypothèse avec leurs connaissances et les données : laquelle tient ? Laquelle est fausse ou incomplète ?","Moyens":"un jeu de données, un outil d’IA autorisé.","Indicateur de réussite":"chaque binôme justifie le rejet d’au moins une hypothèse.","Point de vigilance":"uniquement des données publiques ou fictives.","Mise à jour":""},{"ID":"I40","Coup de cœur":"Non","Niveau":"Classe","Titre":"Le duel des modèles","Public (texte de la fiche)":"De la 4e au lycée, toutes disciplines","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (démonstration)","Durée":"45 min","Pour qui":"élèves","Objectif":"découvrir que le modèle le plus connu n’est pas forcément le plus adapté, et réfléchir au choix des outils.","Étapes":"1. Les élèves répondent d’abord eux-mêmes à une question liée au cours.\n2. Le professeur la soumet à Compar:IA en projection : deux modèles anonymes répondent côte à côte.\n3. En groupes, les élèves comparent : laquelle est la plus juste ? La plus proche du cours ? La plus utile ? Vote argumenté.\n4. Révélation de l’identité des modèles et de leur impact environnemental estimé.","Moyens":"un vidéoprojecteur, Compar:IA.","Indicateur de réussite":"les élèves justifient leur vote par des critères disciplinaires.","Point de vigilance":"l’objectif est d’apprendre à choisir, pas de désigner un champion.","Mise à jour":""},{"ID":"I41","Coup de cœur":"Non","Niveau":"Classe","Titre":"Du prompt vague au prompt précis","Public (texte de la fiche)":"À partir de la 4e, toutes disciplines","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"45 min","Pour qui":"élèves","Objectif":"faire évoluer une consigne vague vers une consigne précise, en comprenant ce que chaque ajout apporte.","Étapes":"1. Chaque élève écrit une première consigne simple : « Explique-moi la photosynthèse en trois étapes. »\n2. Analyse collective de la réponse : qu’est-ce qui manque ? Qu’est-ce qui est trop général ?\n3. Chacun enrichit sa consigne avec la méthode RACE : rôle, action, cadre, exemple.\n4. Comparaison des réponses avant et après.","Moyens":"un outil d’IA autorisé.","Indicateur de réussite":"chaque élève explique ce qu’un ajout a changé dans la réponse.","Point de vigilance":"rappeler que même une bonne consigne ne garantit pas une réponse juste.","Mise à jour":""},{"ID":"I42","Coup de cœur":"Non","Niveau":"Classe","Titre":"Vérifier ses sources en classe","Public (texte de la fiche)":"À partir de la 4e","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée (réponse préparée par le professeur)","Durée":"1 h","Pour qui":"élèves","Objectif":"analyser méthodiquement une réponse d’IA avec les quatre gestes du lecteur critique.","Étapes":"1. Le professeur distribue une réponse générée sur une question du cours, sans dire si elle contient des erreurs.\n2. En binômes, les élèves appliquent quatre gestes : vérifier les affirmations avec une source, repérer ce qui manque, identifier le point de vue implicite, juger si c’est adapté à leur niveau.\n3. Mise en commun des erreurs et oublis repérés.\n4. La classe garde la grille pour ses futurs usages.","Moyens":"une réponse préparée, des sources de référence.","Indicateur de réussite":"chaque binôme applique les quatre gestes.","Point de vigilance":"la grille peut venir de l’activité d’équipe « La grille du lecteur critique ».","Mise à jour":""},{"ID":"I43","Coup de cœur":"Non","Niveau":"Classe","Titre":"Ce que je sais, ce que j’explique","Public (texte de la fiche)":"De la 4e au lycée, toutes disciplines","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"2 séances de 45 min","Pour qui":"élèves","Objectif":"consolider ce qu’on a appris sur l’IA en l’expliquant à d’autres élèves.","Étapes":"1. Chaque élève répond seul : qu’est-ce que je sais expliquer sur l’IA ? Que sais-je faire que je ne savais pas faire ? Qu’est-ce qui me pose encore question ?\n2. En groupes, on compare : les points communs montrent ce qui est acquis, les écarts ce qui reste fragile.\n3. Chaque groupe prépare une présentation de cinq minutes : aucun mot technique non expliqué, un exemple concret obligatoire.\n4. Présentation devant une classe plus jeune, ou un autre groupe.","Moyens":"deux séances, de quoi produire affiches, cartes mentales ou courtes vidéos.","Indicateur de réussite":"le public comprend et peut redire le message principal.","Point de vigilance":"devant une classe plus jeune que la 4e, aucune manipulation d’IA par le public.","Mise à jour":""},{"ID":"I09","Coup de cœur":"Non","Niveau":"Vie scolaire","Titre":"Démêler le vrai du faux en images","Public (texte de la fiche)":"Collège et lycée","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée (images préparées par les adultes)","Durée":"1 h","Pour qui":"CPE, vie scolaire, professeur documentaliste","Objectif":"apprendre aux élèves à repérer les images et vidéos fabriquées par l’IA, et savoir réagir face à un montage qui vise une personne.","Étapes":"1. Les adultes préparent une série d’images, certaines réelles, d’autres générées par une IA.\n2. Les élèves votent : vrai ou faux ? Puis ils cherchent ensemble les indices.\n3. Discussion : à quoi peuvent servir ces montages ? Quelles conséquences pour la personne visée ?\n4. La classe formule trois règles : je ne fabrique pas d’image d’une vraie personne sans son accord, je ne partage pas un montage, je préviens un adulte.\n5. On présente les adultes ressources de l’établissement et le 3018, numéro national contre le cyberharcèlement.","Moyens":"un vidéoprojecteur, une série d’images préparée à l’avance.","Indicateur de réussite":"chaque élève sait dire ce qu’il ferait s’il recevait un montage visant un camarade.","Point de vigilance":"n’utilisez jamais d’images d’élèves ou de personnels réels. Si une situation vécue émerge, appliquez la procédure de l’établissement contre le harcèlement.","Mise à jour":""},{"ID":"I10","Coup de cœur":"Non","Niveau":"Vie scolaire","Titre":"« Ce que tu saisis ne t’appartient plus »","Public (texte de la fiche)":"Collège et lycée","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"1 h","Pour qui":"CPE, vie scolaire","Objectif":"sensibiliser les élèves à la protection de leurs données et aux limites de l’IA comme confidente.","Étapes":"1. Sondage anonyme : pour quoi utilisez-vous l’IA ? Devoirs, recherches, conseils, discussions personnelles ?\n2. Par groupes, les élèves trient des cartes-situations (donner sa photo, parler de ses problèmes, citer le nom d’un camarade, demander de l’aide pour un devoir) en trois tas : « je peux », « je ne devrais pas », « j’en parle plutôt à un adulte ».\n3. Mise en commun : ce qui est saisi peut être conservé et réutilisé, et une IA ne remplace pas un adulte de confiance.\n4. On présente les adultes ressources : CPE, infirmière, psychologue, professeur principal.","Moyens":"des cartes-situations imprimées, un outil de sondage anonyme ou des papiers.","Indicateur de réussite":"les élèves citent au moins deux informations qu’ils ne saisiront plus dans une IA.","Point de vigilance":"la séance peut faire émerger des confidences ou des situations de détresse. Prévoyez un relais vers les adultes ressources et suivez les procédures de l’établissement.","Mise à jour":""},{"ID":"I11","Coup de cœur":"Non","Niveau":"Vie scolaire","Titre":"Faire le point sur nos usages numériques","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"1 h en réunion d’équipe","Pour qui":"équipe éducative","Objectif":"repérer ensemble les usages numériques les plus gourmands en énergie et choisir des gestes de sobriété partagés.","Étapes":"1. En amont, chacun note ses usages numériques professionnels pendant une semaine : outils, fréquence, tâches, recours à l’IA.\n2. Mise en commun : quels usages reviennent le plus ? Lesquels consomment le plus ?\n3. Recherche d’alternatives : peut-on réduire certains usages sans perdre en qualité ? Pour quelles tâches l’IA n’est-elle pas justifiée ?\n4. L’équipe choisit trois gestes communs, à intégrer à la charte d’usage.","Moyens":"une grille de recensement, 1 h de réunion.","Indicateur de réussite":"trois gestes de sobriété sont adoptés et affichés en salle des professeurs.","Point de vigilance":"on raisonne en ordres de grandeur, sans culpabiliser personne. L’objectif est un choix collectif, pas un contrôle. On peut aussi se focaliser sur 4 dimensions inspirées du modèle de Tricot et al. (2003) : conformité, utilité, utilisabilité et acceptabilité.","Mise à jour":""},{"ID":"I12","Coup de cœur":"Non","Niveau":"Vie scolaire","Titre":"Créer un club IA au lycée","Public (texte de la fiche)":"Lycée","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"Lancement de 1 h, puis rendez-vous réguliers","Pour qui":"CPE, assistant d’éducation, enseignant ou professeur documentaliste, élèves volontaires","Objectif":"réunir des élèves pour explorer, questionner et partager des usages de l’IA, dans un cadre réfléchi.","Étapes":"1. Séance de lancement : les élèves définissent les objectifs, le fonctionnement et les règles du club, et choisissent leurs premières questions.\n2. À chaque rendez-vous, un ou deux membres présentent une découverte, une expérience ou une question, puis le groupe échange et teste.\n3. Un carnet de bord collectif garde la trace des découvertes et des réflexions.\n4. Le club peut inviter des intervenants et contribuer à la charte d’usage de l’établissement.","Moyens":"une salle, des outils d’IA autorisés par l’établissement, un créneau régulier.","Indicateur de réussite":"le club se réunit au moins une fois par mois sur un trimestre et partage une production avec l’établissement.","Point de vigilance":"aucune donnée personnelle dans les outils. Veillez à l’équilibre entre curiosité et esprit critique, et ouvrez le club aux élèves peu à l’aise avec le numérique.","Mise à jour":""},{"ID":"I44","Coup de cœur":"Non","Niveau":"Vie scolaire","Titre":"Mon empreinte numérique : recenser, comprendre, communiquer","Public (texte de la fiche)":"Collège et lycée","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"2 séances de 1 h","Pour qui":"élèves, CPE, vie scolaire, professeur","Objectif":"prendre conscience de son empreinte numérique et sensibiliser la communauté scolaire.","Étapes":"1. Chaque élève recense ses usages numériques sur une journée type : vidéos, messages, réseaux sociaux, recherches, IA.\n2. À partir de repères fournis, il estime l’ordre de grandeur de l’énergie consommée par chaque usage.\n3. Mise en commun anonyme : quels usages dominent ? Quelle place pour l’IA ? Quelles surprises ?\n4. Par groupes, les élèves produisent un support de sensibilisation : affiche, infographie, article, courte vidéo.\n5. Les productions sont exposées ou diffusées dans l’établissement.","Moyens":"une grille de recensement, des repères chiffrés, du matériel de production.","Indicateur de réussite":"au moins une production diffusée à toute la communauté scolaire.","Point de vigilance":"on raisonne en ordres de grandeur, sans culpabiliser. Résultats mis en commun de façon anonyme.","Mise à jour":""}],"glossaire":[{"Mot":"Activité débranchée","Définition":"Une activité qui fait comprendre le fonctionnement du numérique ou de l’IA sans écran, avec des cartes, des jeux ou des objets. Idéale au 1er degré et même après.","Pour aller plus loin":"Idées d’action 4, 6, 7, 8"},{"Mot":"AI Act (règlement européen sur l’IA)","Définition":"Le règlement européen qui encadre l’IA. Il classe les usages selon leur niveau de risque et impose la transparence.","Pour aller plus loin":"Fiche « Cadre d’usage »"},{"Mot":"Algorithme","Définition":"Une suite d’instructions qu’une machine suit pour accomplir une tâche, un peu comme une recette de cuisine.","Pour aller plus loin":"–"},{"Mot":"Apprentissage automatique","Définition":"La façon dont une machine apprend à partir d’exemples, plutôt qu’à partir de règles écrites une à une. On parle aussi de machine learning.","Pour aller plus loin":"Idée d’action 8"},{"Mot":"Biais","Définition":"Une déformation dans les réponses d’une IA, souvent héritée des données qui ont servi à l’entraîner : stéréotypes, oublis, points de vue dominants.","Pour aller plus loin":"Fiche « Enjeux éthiques »"},{"Mot":"Boîte noire","Définition":"Se dit d’un système dont on ne peut pas expliquer en détail comment il arrive à un résultat. C’est le cas des grands modèles d’IA, même pour ceux qui les conçoivent.","Pour aller plus loin":"–"},{"Mot":"Cadre d’usage","Définition":"Le document de l’Éducation nationale qui fixe les repères pour utiliser l’IA à l’école : pédagogiques, éthiques, juridiques et environnementaux.","Pour aller plus loin":"Fiche « Cadre d’usage »"},{"Mot":"Charte d’usage","Définition":"Les règles qu’un établissement se donne pour l’usage de l’IA, par les adultes et par les élèves. On peut aussi parler de code de bonnes conduites, de contrat de classe, d’un pacte, code d’honneur ... L’idée est de co-construire un document. Le document sera plus facilement adopté s’il a été co-construit.","Pour aller plus loin":"Idée d’action 1"},{"Mot":"Chatbot (agent conversationnel)","Définition":"Un programme avec lequel on dialogue par écrit ou à l’oral, comme ChatGPT, Le Chat ou Gemini.","Pour aller plus loin":"–"},{"Mot":"Compar:IA","Définition":"Un comparateur d’IA conversationnelles : il soumet une même question à deux modèles anonymes et donne une estimation de leur impact environnemental.","Pour aller plus loin":"FAQ « Usage frugal »"},{"Mot":"Données d’entraînement","Définition":"Les immenses quantités de textes, d’images ou de sons à partir desquelles une IA a appris. Ce qu’elle produit en reflète les richesses et les biais.","Pour aller plus loin":"Fiche « Comment fonctionne une IA générative ? »"},{"Mot":"Données personnelles","Définition":"Toute information qui permet d’identifier une personne : nom, photo, adresse, résultats scolaires, absences… Jamais dans un outil d’IA grand public.","Pour aller plus loin":"Fiche « Données personnelles »"},{"Mot":"DPO (délégué à la protection des données)","Définition":"La personne chargée de veiller au respect du RGPD dans un organisme. Elle est consultée avant d’adopter un outil qui traite des données.","Pour aller plus loin":"Fiche « Données personnelles »"},{"Mot":"Empreinte environnementale","Définition":"L’ensemble des impacts d’un outil sur l’environnement : énergie, eau, matériaux, émissions de CO2, de la fabrication à l’usage.","Pour aller plus loin":"Fiche « Enjeux éthiques »"},{"Mot":"Hallucination","Définition":"Une réponse fausse ou inventée qu’une IA présente avec assurance, comme une source ou une citation qui n’existe pas.","Pour aller plus loin":"FAQ « Comprendre l’IA »"},{"Mot":"Hypertrucage (deepfake)","Définition":"Une image, une vidéo ou une voix fabriquée par l’IA pour imiter une personne réelle.","Pour aller plus loin":"Idée d’action 9"},{"Mot":"IA générative","Définition":"Une IA capable de produire du texte, des images ou des sons à partir d’une consigne.","Pour aller plus loin":"Fiche « Comment fonctionne une IA générative ? »"},{"Mot":"Intelligence artificielle (IA)","Définition":"Un ensemble de techniques qui permettent à une machine d’imiter certaines fonctions de l’intelligence humaine : reconnaître, prédire, produire. Le terme date de 1956.","Pour aller plus loin":"FAQ « Comprendre l’IA »"},{"Mot":"Modèle de langage (LLM)","Définition":"Le moteur d’une IA générative de texte : il prédit, mot après mot, la suite la plus probable d’un texte.","Pour aller plus loin":"Fiche « Comment fonctionne une IA générative ? »"},{"Mot":"Open source (libre)","Définition":"Se dit d’un outil dont le code est public et peut être vérifié ou réutilisé. Le cadre invite à privilégier les outils libres.","Pour aller plus loin":"FAQ « Outils respectueux »"},{"Mot":"Probabiliste","Définition":"Qui fonctionne par calcul de probabilités. Une IA générative choisit la suite la plus probable, ce qui explique que ses réponses varient.","Pour aller plus loin":"Fiche « Comment fonctionne une IA générative ? »"},{"Mot":"Profilage","Définition":"L’analyse automatique de données pour évaluer ou prédire le comportement d’une personne. Encadré par le RGPD, il ne doit pas décider à la place des adultes.","Pour aller plus loin":"Fiche « Données personnelles »"},{"Mot":"Prompt","Définition":"La consigne que l’on donne à une IA. Pour bien la rédiger, pensez à la méthode RACE.","Pour aller plus loin":"Fiche « Méthode RACE »"},{"Mot":"RACE (méthode)","Définition":"Un repère pour rédiger un prompt : Rôle, Action, Cadre ou contexte, Exemple.","Pour aller plus loin":"Fiche « Méthode RACE »"},{"Mot":"Réseau de neurones","Définition":"Une architecture de calcul inspirée, de loin, du cerveau, qui permet à une machine d’apprendre à partir d’exemples. Elle est au cœur des IA actuelles.","Pour aller plus loin":"–"},{"Mot":"RGPD","Définition":"Le règlement européen qui protège les données personnelles, y compris celles des élèves et des personnels.","Pour aller plus loin":"Fiche « Données personnelles »"},{"Mot":"Sobriété numérique","Définition":"Utiliser le numérique, et l’IA, seulement quand c’est utile, pour réduire son impact. Première question : avez-vous besoin de l’IA pour cela ?","Pour aller plus loin":"Idée d’action 11"},{"Mot":"Transparence","Définition":"Dire quand et comment on utilise l’IA : un enseignant avec ses élèves, un établissement avec les familles, un élève dans son travail.","Pour aller plus loin":"FAQ « Transparence »"},{"Mot":"Vérification","Définition":"Le réflexe de contrôler une réponse d’IA en la comparant à d’autres sources fiables, avant de l’utiliser ou de la partager.","Pour aller plus loin":"Fiche « Comment fonctionne une IA générative ? »"}],"ressources":[{"ID":"R01","Rubrique":"Comprendre l’IA","Titre":"Comment fonctionnent les grands modèles de langage","Lien":"https://uneiaparjour.github.io/how-llms-work/","Type":"Site explicatif","Pour qui":"Tous","Durée":"30 min","Éditeur":"Une IA par jour","Remarque":"Pour voir, pas à pas, comment un modèle prédit le mot suivant.","profilsCodes":["tous"]},{"ID":"R02","Rubrique":"Comprendre l’IA","Titre":"L’IA : comment ça marche ? (DidakLab)","Lien":"https://novapeda.eu/didaklab","Type":"Site interactif","Pour qui":"Tous","Durée":"30 min","Éditeur":"Novapeda","Remarque":"À tester avant de le proposer aux collègues.","profilsCodes":["tous"]},{"ID":"R03","Rubrique":"Comprendre l’IA","Titre":"Histoire de l’IA en 7 dates clés","Lien":"https://www.ultimedia.com/deliver/generic/iframe/mdtk/01870326/src/qvlqzkf/zone/1/showtitle/1/","Type":"Vidéo","Pour qui":"Tous","Durée":"5 min","Éditeur":"Les Echos","Remarque":"Utile pour la FAQ « L’IA est   /* ==========================================================
     Porte 1 – « J'ai une question » (FAQ)
     ========================================================== */
  var FAQ = DONNEES.faq || [];
  var THEMES = (DONNEES.listes && DONNEES.listes["Thèmes FAQ"]) || [];
  var ICONES_THEMES = ["puce", "balance", "globe", "ecran", "coeur", "boussole"];
  var THEME_SOBRIETE = 2; // « Enjeux éthiques et sociétaux » : l'encart sobriété y est rappelé
  var LIEN_FORMS = PARAMS["Lien du formulaire de questions"] || "";
  var POUR_QUI = {
    dir: "Pour les cheffes et chefs d’établissement",
    ens: "Pour les enseignants",
    cpe: "Pour les CPE et la vie scolaire"
  };

  function faqParId(id) {
    return FAQ.filter(function (q) { return q.ID === id; })[0];
  }
  function concerne(q, profil) {
    var codes = q.profilsCodes || ["tous"];
    return codes.indexOf("tous") >= 0 || codes.indexOf(profil) >= 0;
  }

  /* Questions fréquentes : celles marquées « Oui » dans la colonne Fréquente,
     sinon les trois premières qui concernent le profil. */
  function questionsFrequentes(profil) {
    var pourMoi = FAQ.filter(function (q) { return concerne(q, profil); });
    var marquees = pourMoi.filter(function (q) { return (q["Fréquente"] || "").toLowerCase() === "oui"; });
    return marquees.length ? marquees.slice(0, 5) : pourMoi.slice(0, 3);
  }

  /* --- Recherche : sans tenir compte des accents ni des majuscules --- */
  var MOTS_VIDES = ("a au aux avec ce ces cette d de des du elle en est et il ils j je l la le les leur leurs " +
    "ma me mes mon ne nos notre nous on ou par pas peut pour qu que quel quelle quels quelles qui sa se ses " +
    "son sur ta te tes ton tu un une vos votre vous y faire faut comment quoi est-ce").split(" ");

  function normaliser(texte) {
    return String(texte || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().replace(/[’']/g, " ").replace(/[^a-z0-9]+/g, " ").trim();
  }
  function motsCles(requete) {
    return normaliser(requete).split(" ").filter(function (m) {
      return m && MOTS_VIDES.indexOf(m) < 0;
    });
  }
  /* Quelques mots du terrain qui ne figurent pas tels quels dans la FAQ :
     on cherche aussi leur équivalent. (À compléter au fil des remontées.) */
  var SYNONYMES = {
    ecologie: ["environnement", "energie"], ecologique: ["environnement", "energie"], climat: ["environnement"],
    planete: ["environnement"], energie: ["environnement"], eau: ["environnement"], carbone: ["co2"],
    deepfake: ["montage", "truque"], hypertrucage: ["montage", "truque"], trucage: ["montage", "truque"],
    robot: ["chatbot", "chatgpt"], chatbot: ["chatgpt"], agent: ["chatbot"], conversationnel: ["chatbot"],
    tricher: ["triche", "fraude"], plagiat: ["triche", "fraude"], copie: ["triche", "fraude"],
    rgpd: ["donnees"], vie: ["donnees"], privee: ["donnees"],
    parent: ["famille"], parents: ["famille"], harcelement: ["montage", "victime"],
    prof: ["enseignant"], profs: ["enseignant"], professeur: ["enseignant"], directeur: ["etablissement"],
    eglise: ["pape", "encyclique"], pape: ["eglise", "encyclique"]
  };

  // « ia » doit être un mot entier ; « élèves » trouve aussi « élève » (début de mot)
  function trouveMot(texte, mot) {
    var racine = mot.length > 4 ? mot.replace(/(s|x)$/, "") : mot;
    var fin = mot.length <= 3 ? "\\b" : "";
    return new RegExp("\\b" + racine + fin).test(texte);
  }
  function rechercher(requete) {
    var mots = motsCles(requete);
    if (!mots.length) return { exacts: [], proches: [] };
    var notes = FAQ.map(function (q) {
      var question = " " + normaliser(q.Question) + " ";
      var reste = " " + normaliser(q["Thème"] + " " + q["Réponse"]) + " ";
      var trouves = 0, note = 0;
      mots.forEach(function (m) {
        var variantes = [m].concat(SYNONYMES[m] || []);
        var dansQuestion = variantes.some(function (v) { return trouveMot(question, v); });
        var dansReste = variantes.some(function (v) { return trouveMot(reste, v); });
        if (dansQuestion || dansReste) trouves += 1;
        note += (dansQuestion ? 3 : 0) + (dansReste ? 1 : 0);
      });
      return { q: q, trouves: trouves, note: note };
    }).filter(function (n) { return n.trouves > 0; });
    notes.sort(function (a, b) { return b.trouves - a.trouves || b.note - a.note; });
    return {
      exacts: notes.filter(function (n) { return n.trouves === mots.length; }).map(function (n) { return n.q; }),
      proches: notes.filter(function (n) { return n.trouves < mots.length; }).slice(0, 5).map(function (n) { return n.q; })
    };
  }

  /* Suggestions « Essayez un autre mot » : des mots du glossaire proches de la recherche
     et qui donnent au moins une réponse dans la FAQ. */
  function trigrammes(texte) {
    var t = "  " + normaliser(texte) + " ", ens = {};
    for (var i = 0; i < t.length - 2; i++) ens[t.substr(i, 3)] = true;
    return ens;
  }
  function ressemblance(a, b) {
    var ta = trigrammes(a), tb = trigrammes(b), commun = 0, total = 0;
    Object.keys(ta).forEach(function (k) { total += 1; if (tb[k]) commun += 1; });
    Object.keys(tb).forEach(function (k) { if (!ta[k]) total += 1; });
    return total ? commun / total : 0;
  }
  function suggestions(requete) {
    var candidats = (DONNEES.glossaire || []).map(function (g) {
      var court = g.Mot.replace(/\s*\(.*\)\s*/, "").trim();
      return { mot: court, note: ressemblance(requete, g.Mot) };
    }).filter(function (c) {
      return normaliser(c.mot) !== normaliser(requete) && rechercher(c.mot).exacts.length > 0;
    });
    candidats.sort(function (a, b) { return b.note - a.note; });
    var proches = candidats.filter(function (c) { return c.note >= 0.12; }).slice(0, 3).map(function (c) { return c.mot; });
    // Rien d'approchant : on propose des mots qui ouvrent beaucoup de réponses
    return proches.length ? proches : ["élèves", "familles", "données personnelles"];
  }

      '<button type="submit" class="bouton bouton--plein">' + icone("loupe", 20, "#ffffff", 2.5) + "Rechercher</button>" +

  function brancherRecherche(main) {

  /* --- Les écrans de la porte 1 --- */
  function ecranQuestions(params) {
    if (!params.length || !params[0]) return ecranQuestionsAccueil();
    if (params[0] === "recherche") return ecranRecherche(params.slice(1).join("/"));
    if (params[0] === "theme") return ecranTheme(parseInt(params[1], 10));
