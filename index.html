/* ==========================================================
   Phare IA – feuille de styles
   Charte ISFEC, univers formation continue.
   Conçue d'abord pour le téléphone (390 px), puis l'ordinateur.
   ========================================================== */

:root {
  /* Les seules couleurs autorisées par la charte */
  --rouge: #e73b25;
  --orange: #f7a720;   /* porte 1 : J'ai une question */
  --rose: #ea528b;     /* porte 2 : Je me ressource */
  --vert: #1fa138;     /* porte 3 : Je passe à l'action */
  --noir: #1e1e1c;
  --gris-bleu: #f1f6f9;
  --ardoise: #455259;
  --blanc: #ffffff;
  --filet: #dfe6ea;    /* filets très clairs (repris de la maquette) */

  --titre: "Roboto Slab", Georgia, serif;
  --texte: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --largeur-max: 1160px;
  --barre-bas: 76px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--blanc);
  color: var(--noir);
  font-family: var(--texte);
  font-size: 1rem;
  line-height: 1.45;
  padding-bottom: var(--barre-bas);
}
body.sans-nav { padding-bottom: 0; }

img, svg { display: block; max-width: 100%; }

a { color: var(--noir); text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--rouge); }

h1, h2, h3 { font-family: var(--titre); margin: 0; }

/* Focus clavier bien visible, partout */
:focus-visible {
  outline: 3px solid var(--noir);
  outline-offset: 3px;
  box-shadow: 0 0 0 6px var(--blanc);
  border-radius: 4px;
}
main:focus, h1:focus { outline: none; box-shadow: none; }

.evitement {
  position: absolute; left: 8px; top: -100px; z-index: 100;
  background: var(--noir); color: var(--blanc);
  padding: 12px 16px; border-radius: 8px; font-weight: 700;
}
.evitement:focus { top: 8px; color: var(--blanc); }

.annonce {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; margin: -1px;
}

/* ---------- En-tête ---------- */
.entete__dedans {
  max-width: var(--largeur-max);
  margin: 0 auto;
  min-height: 72px;
  padding: 14px 16px 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.entete__logo { display: block; border-radius: 4px; padding: 2px 0; }
.logo-tel { width: 92px; height: auto; }
.logo-ordi { display: none; width: 140px; height: auto; }

.nav-haut { display: none; }

.raccourcis-tel { display: flex; gap: 4px; }
.raccourci {
  min-height: 48px; min-width: 48px; padding: 0 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--noir); font-size: 13px; font-weight: 700;
}

/* ---------- Mosaïque (profil et accueil seulement) ---------- */
.mosaique img { width: 100%; object-fit: cover; object-position: left center; }
.mosaique--tel { height: 49px; }
.mosaique--ordi { display: none; height: 28px; }

/* ---------- Zone principale ---------- */
main { flex: 1; width: 100%; }
.page { max-width: var(--largeur-max); margin: 0 auto; padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 16px; }

.titre-page {
  font-weight: 900; font-size: 28px; line-height: 1.15; color: var(--rouge);
}
.intertitre { font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--rouge); }
.intertitre--noir { color: var(--noir); font-size: 20px; line-height: 1.25; }
.petit { font-size: 14px; }
.visuellement-cache { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }
.chapeau { margin: 0; font-size: 16px; line-height: 1.45; }
.discret { margin: 0; font-size: 15px; line-height: 1.4; color: var(--ardoise); }

/* ---------- Boutons ---------- */
.bouton {
  min-height: 56px; padding: 0 28px; border-radius: 12px;
  border: 0; background: var(--noir); color: var(--blanc);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--texte); font-size: 18px; font-weight: 700; line-height: 1.2;
  text-decoration: none; cursor: pointer;
}
.bouton:hover { color: var(--blanc); background: #000; }
.bouton:active { transform: translateY(1px); }
.bouton--plein { width: 100%; }

.lien-bouton {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: inherit; font-weight: 700; color: var(--noir);
  text-decoration: underline; text-underline-offset: 2px;
  min-height: 48px; display: inline-flex; align-items: center;
}
.lien-bouton:hover { color: var(--rouge); }

/* ---------- Phare ---------- */
.titre-et-phare { display: flex; align-items: flex-end; gap: 12px; }
.titre-et-phare > :first-child { flex: 1; }
.phare { flex: none; width: 76px; height: 76px; }

/* Variantes téléphone / ordinateur */
.phare-ordi, .texte-ordi { display: none; }
.lien-fort { font-weight: 700; color: var(--noir); }
.accueil__haut .discret { margin-top: 8px; }

/* ---------- Écran profil ---------- */
.profil__entete { display: flex; align-items: center; gap: 12px; }
.profil__entete > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.profil__choix { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; border: 0; }
.carte-profil {
  width: 100%; min-height: 84px; padding: 14px 16px; border-radius: 16px;
  background: var(--blanc); border: 2px solid var(--ardoise);
  display: flex; align-items: center; gap: 14px;
  font-family: var(--texte); color: var(--noir); text-align: left; cursor: pointer;
}
.carte-profil:hover { border-color: var(--noir); background: var(--gris-bleu); }
.carte-profil[aria-pressed="true"] { border: 3px solid var(--rouge); padding: 13px 15px; }
.carte-profil__icone {
  flex: none; width: 48px; height: 48px; border-radius: 24px; background: var(--gris-bleu);
  display: flex; align-items: center; justify-content: center;
}
.carte-profil__textes { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.carte-profil__nom { font-size: 18px; font-weight: 700; line-height: 1.25; }
.carte-profil__aide { font-size: 15px; line-height: 1.35; color: var(--ardoise); }
.carte-profil__coche {
  flex: none; width: 32px; height: 32px; border-radius: 16px; border: 2px solid var(--ardoise);
  display: flex; align-items: center; justify-content: center;
}
.carte-profil[aria-pressed="true"] .carte-profil__coche { background: var(--rouge); border-color: var(--rouge); }
.message-erreur {
  margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--gris-bleu);
  border-left: 6px solid var(--rouge); font-weight: 700;
}
.confidentialite-courte { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-size: 14px; line-height: 1.45; color: var(--ardoise); }
.confidentialite-courte svg { flex: none; margin-top: 1px; }

/* ---------- Accueil : les trois portes ---------- */
.portes { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.porte {
  min-height: 124px; padding: 18px 16px 18px 18px; border-radius: 16px;
  color: var(--noir); text-decoration: none;
  display: flex; align-items: center; gap: 14px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.porte:hover { color: var(--noir); transform: translateY(-2px); box-shadow: 0 6px 0 rgba(30, 30, 28, .18); }
.porte--question { background: var(--orange); }
.porte--ressource { background: var(--rose); }
.porte--action { background: var(--vert); }
.porte__icone {
  flex: none; width: 52px; height: 52px; border-radius: 26px; background: var(--blanc);
  display: flex; align-items: center; justify-content: center;
}
.porte__textes { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.porte__titre { font-family: var(--titre); font-weight: 900; font-size: 24px; line-height: 1.15; }
.porte__sous-titre { font-size: 19px; line-height: 1.3; }
.porte__appel { display: none; }
.porte__fleche { flex: none; }

/* ---------- Bandeau de porte (en haut de chaque porte) ---------- */
.bandeau { padding: 8px 20px 24px; }
.bandeau--question { background: var(--orange); }
.bandeau--ressource { background: var(--rose); }
.bandeau--action { background: var(--vert); }
.bandeau--neutre { background: var(--gris-bleu); }
.bandeau__dedans { max-width: var(--largeur-max); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.bandeau .titre-page { color: var(--noir); font-size: 30px; }
.bandeau--neutre .titre-page { color: var(--rouge); }
.bandeau__chapeau { margin: 0; font-size: 17px; line-height: 1.45; }
.retour {
  align-self: flex-start; min-height: 48px; padding-right: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  background: none; border: 0; cursor: pointer;
  font-family: var(--texte); font-size: 17px; font-weight: 700; color: var(--noir);
  text-decoration: none;
}
.retour:hover { color: var(--noir); text-decoration: underline; }

.encadre {
  padding: 18px; border-radius: 16px; background: var(--gris-bleu);
  display: flex; flex-direction: column; gap: 8px;
}
.encadre p { margin: 0; }

/* ---------- Porte 1 : FAQ ---------- */
.page--etroite { max-width: 760px; }
.porte1 { gap: 32px; }
.porte1__colonne { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.porte1 section > .discret { margin-top: 4px; }

.bouton--contour { background: var(--blanc); color: var(--noir); border: 2px solid var(--noir); min-height: 52px; font-size: 17px; }
.bouton--contour:hover { background: var(--gris-bleu); color: var(--noir); }

.recherche { display: flex; flex-direction: column; gap: 10px; }
.recherche__label { font-size: 16px; font-weight: 700; }
.recherche__champ { position: relative; }

<script type="application/json" id="donnees">{"faq":[{"ID":"FAQ01","Thème":"Comprendre l’IA","Question":"L’IA a forcément raison, vu la quantité de données sur lesquelles elle est entraînée ?","Réponse":"Non. Une IA générative est probabiliste : elle calcule la suite la plus probable d’un texte, sans vérifier ce qui est vrai. Elle peut se tromper, inventer, et laisser dans l’ombre des angles morts. Sa réponse dépend aussi beaucoup du prompt de départ. D’où l’importance de comparer plusieurs modèles, de connaître leurs biais culturels et linguistiques, et de garder en tête leur impact environnemental. Voir les fiches « Comment fonctionne une IA générative ? » et « La méthode RACE ».","Profils":"Tous","Source":"Support équipe éducative (ISFEC)","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ02","Thème":"Comprendre l’IA","Question":"L’IA est-elle une invention récente, née avec ChatGPT en 2022 ?","Réponse":"Non, c’est une discipline ancienne. Les premières réflexions sur les machines « intelligentes » datent des années 1950, et l’expression « intelligence artificielle » est apparue en 1956. Depuis, l’IA est présente dans de nombreux outils du quotidien : correcteurs, traduction, GPS, recommandations de vidéos. Ce qui est récent, c’est l’arrivée des IA génératives grand public, avec ChatGPT fin 2022, qui a rendu l’IA visible et accessible à tous.","Profils":"Tous","Source":"Repère général, hors supports de formation","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ03","Thème":"Comprendre l’IA","Question":"Comment fonctionne une IA générative ?","Réponse":"Elle prédit, mot après mot, la suite la plus probable d’un texte, à partir des immenses quantités de données sur lesquelles elle a été entraînée. Elle produit un langage fluide, mais ne comprend pas le sens de ce qu’elle écrit.","Profils":"Tous","Source":"Support équipe éducative (ISFEC)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ04","Thème":"Comprendre l’IA","Question":"L’IA, c’est un super moteur de recherche : quelques mots-clés suffisent pour obtenir une bonne réponse ?","Réponse":"Pas du tout. Un moteur de recherche vous oriente vers des sources existantes, que vous pouvez consulter. Une IA générative produit un nouveau texte, sans toujours dire d’où viennent ses informations. Avec quelques mots-clés, elle devine ce que vous attendez et répond de façon générale, parfois à côté. Pour une réponse utile, rédigez une vraie consigne : son rôle, l’action attendue, le contexte et un exemple (méthode RACE). Et pour une information factuelle, un moteur de recherche ou une ressource de référence reste souvent plus sûr, et plus sobre.","Profils":"Tous","Source":"Supports de formation ISFEC","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ05","Thème":"Comprendre l’IA","Question":"Qu’est-ce qu’une « hallucination » ?","Réponse":"C’est une réponse fausse ou inventée que l’IA présente avec assurance : un chiffre, une citation, une source qui n’existe pas. L’IA est conçue pour répondre coûte que coûte, plutôt que de dire « je ne sais pas ». Vérifiez toujours les sources.","Profils":"Tous","Source":"Support équipe éducative et support élèves (ISFEC)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ06","Thème":"Comprendre l’IA","Question":"Pourquoi l’IA me donne-t-elle deux réponses différentes à la même question ?","Réponse":"Parce que son calcul est probabiliste : une même demande peut produire des réponses différentes. Ce n’est pas un défaut, mais une raison de plus de ne pas prendre une réponse pour une vérité.","Profils":"Tous","Source":"Référentiel de compétences en IA pour les enseignants (UNESCO)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ07","Thème":"Comprendre l’IA","Question":"Comment obtenir une réponse vraiment utile ?","Réponse":"En soignant votre consigne, le prompt. La méthode RACE aide à n’oublier aucun ingrédient : le Rôle de l’IA, l’Action attendue, le Cadre ou contexte, et un Exemple si vous en avez un. Puis relisez et ajustez toujours la réponse.","Profils":"Tous","Source":"Supports de formation ISFEC","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ08","Thème":"Cadre et règles","Question":"Ai-je le droit de faire manipuler l’IA à mes élèves de 6e ?","Réponse":"Non. L’usage de l’IA générative par les élèves est encadré : il est possible en classe à partir de la 4e, et il est déconseillé de faire manipuler ces outils aux enfants de moins de 13 ans. En 6e, vous pouvez en revanche sensibiliser vos élèves sans manipulation : activités débranchées, ou analyse en classe d’un texte généré que vous apportez vous-même. Voir les idées de la porte « Je passe à l’action ».","Profils":"Enseignants","Source":"Cadre d’usage (extraits présentés en formation) ; formation ISFEC","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ09","Thème":"Cadre et règles","Question":"J’ai extrait un fichier des absences de l’année depuis École Directe. Puis-je le déposer tel quel dans ChatGPT ou Gemini pour l’analyser ?","Réponse":"Non. Ce fichier contient des données personnelles d’élèves : il ne doit jamais être déposé dans un outil d’IA grand public. Remplacer les noms ne suffit pas toujours, car des recoupements restent possibles. La bonne méthode : demandez à l’IA de vous aider à construire l’analyse (formules, tableau croisé, graphique) à partir de quelques lignes de données inventées, puis appliquez-la vous-même dans Excel au vrai fichier, sans IA.","Profils":"Chefs d’établissement, CPE, enseignants","Source":"Atelier vie scolaire et CPE (ISFEC)","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens","cpe"]},{"ID":"FAQ10","Thème":"Cadre et règles","Question":"Existe-t-il des outils plus respectueux de nos données personnelles ?","Réponse":"Oui. La formation présente des alternatives plus respectueuses de la vie privée ou plus transparentes, comme Compar:IA, Vittascience, Duck AI ou EURIA, et d’autres recommandations figurent sur le padlet. Pour un usage professionnel, privilégiez les outils validés par votre établissement, en lien avec le DPO. Et même avec un outil réputé respectueux, la règle reste la même : aucune donnée personnelle.","Profils":"Tous","Source":"Support conférence parents et support équipe éducative (ISFEC)","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ11","Thème":"Cadre et règles","Question":"Quels outils d’IA puis-je utiliser avec mes élèves ?","Réponse":"À partir de la 4e, uniquement des outils autorisés par votre établissement, utilisés en classe, de façon encadrée et expliquée. Renseignez-vous auprès de votre direction ou du référent numérique, et vérifiez la charte d’usage de l’établissement si elle existe. Aucune donnée personnelle des élèves ne doit être saisie.","Profils":"Enseignants","Source":"Cadre d’usage (extraits présentés en formation)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ12","Thème":"Cadre et règles","Question":"Puis-je utiliser un logiciel qui détecte les textes écrits par une IA ?","Réponse":"Mieux vaut l’éviter. Ces logiciels sont peu fiables et pourraient conduire à pénaliser un élève à tort. Évaluez plutôt la démarche : explication orale, étapes intermédiaires, justification des choix.","Profils":"Enseignants","Source":"Cadre d’usage (extraits présentés en formation)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ13","Thème":"Cadre et règles","Question":"Puis-je utiliser l’IA pour mes tâches administratives (mails, comptes rendus) ?","Réponse":"Oui, l’usage administratif est possible, avec quelques règles : aucune donnée personnelle, des documents nettoyés avant de les confier à l’outil, une relecture systématique, et le respect de la charte informatique de l’établissement. Si l’IA intervient dans une décision éducative ou administrative, les personnes concernées doivent en être informées.","Profils":"Chefs d’établissement, CPE, enseignants","Source":"Atelier vie scolaire et CPE (ISFEC)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens","cpe"]},{"ID":"FAQ14","Thème":"Enjeux éthiques et sociétaux","Question":"Comment avoir un usage frugal de l’IA ?","Réponse":"Commencez par une question : avez-vous besoin de l’IA pour cette question ? Pour une information factuelle, un moteur de recherche, un manuel ou un collègue suffisent souvent. Quand l’IA est utile, soignez votre prompt pour éviter les allers-retours, limitez la génération d’images et de vidéos, et préférez des outils plus sobres : Compar:IA, par exemple, permet de comparer des modèles et donne une estimation de leur impact.","Profils":"Tous","Source":"Support conférence parents et support élèves (ISFEC)","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ15","Thème":"Enjeux éthiques et sociétaux","Question":"Quel est l’impact environnemental de l’IA ?","Réponse":"Les systèmes d’IA consomment de l’énergie, de l’eau et des ressources, et émettent du CO2. Entraîner et faire fonctionner un grand modèle mobilise des dizaines de milliers de cartes graphiques, et la demande en électricité liée à l’IA pourrait augmenter de 1,5 à 3 % d’ici 2030. Une requête isolée consomme peu, mais c’est la somme des usages qui compte.","Profils":"Tous","Source":"Magnifica humanitas (§101) ; support conférence parents (ISFEC, d’après The Shift Project et l’AIE)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ16","Thème":"Enjeux éthiques et sociétaux","Question":"Qu’est-ce qu’un biais et pourquoi s’en soucier ?","Réponse":"Un biais est une déformation dans les réponses de l’IA, souvent héritée de ses données d’entraînement : stéréotypes, oublis, points de vue dominants, langue majoritaire. Présentée comme neutre, l’IA peut ainsi renforcer des préjugés. D’où l’importance de croiser les sources et de développer l’esprit critique des élèves.","Profils":"Tous","Source":"Magnifica humanitas (§102) ; Référentiel de compétences en IA (UNESCO)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ17","Thème":"Enjeux éthiques et sociétaux","Question":"Un élève est victime d’un montage (photo ou vidéo truquée). Que faire ?","Réponse":"C’est une situation grave, à traiter sans attendre. Protégez l’élève et ne diffusez pas le contenu. Informez immédiatement la direction et le CPE, et suivez la procédure de l’établissement contre le harcèlement. L’élève et sa famille peuvent aussi appeler le 3018, numéro national contre le cyberharcèlement, qui aide notamment à faire retirer les contenus. Ce point n’est pas détaillé dans la formation : vérifiez la procédure en vigueur dans votre établissement.","Profils":"Chefs d’établissement, CPE, enseignants","Source":"Repère général, hors supports de formation","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens","cpe"]},{"ID":"FAQ18","Thème":"Enjeux éthiques et sociétaux","Question":"Que dit l’Église sur l’intelligence artificielle ?","Réponse":"Dans sa première encyclique, Magnifica humanitas (2026), le pape Léon XIV invite à faire de la dignité de la personne le critère de tout progrès. Guidée par la sagesse, la technique sert le développement humain ; si elle domine, l’humain devient un moyen. L’encyclique appelle à une alliance éducative pour accompagner les jeunes vers un usage responsable.","Profils":"Tous","Source":"Magnifica humanitas et son infographie","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ19","Thème":"Enjeux éthiques et sociétaux","Question":"L’IA va-t-elle remplacer les enseignants ?","Réponse":"Non. L’IA imite certaines fonctions de l’intelligence humaine, mais elle n’a ni conscience morale ni expérience de la relation. L’école offre ce que le numérique seul ne peut donner : du temps partagé pour apprendre et des relations de confiance. Le professeur reste l’expert de sa discipline et de ses élèves.","Profils":"Enseignants","Source":"Magnifica humanitas ; Référentiel de compétences en IA pour les enseignants (UNESCO)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ20","Thème":"En classe et avec les élèves","Question":"Comment être transparent avec les élèves sur l’usage de l’IA ?","Réponse":"Montrez l’exemple : dites quand et comment vous utilisez l’IA pour préparer vos cours, et ce que vous vérifiez ensuite. Posez des règles claires en début d’année : ce qui est autorisé, pour quelles tâches, et ce qui ne l’est pas. Demandez aux élèves, quand l’usage est autorisé, d’indiquer en une phrase ce que l’IA leur a apporté. La transparence vaut dans les deux sens.","Profils":"Enseignants","Source":"Supports de formation ISFEC ; cadre d’usage (extraits présentés en formation)","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ21","Thème":"En classe et avec les élèves","Question":"J’ai l’impression que mes élèves font tous leurs devoirs maison avec l’IA. Je ne corrige plus des élèves mais un chatbot. Comment redonner le plaisir de travailler ensemble, humain et machine ?","Réponse":"Déplacez la valeur du produit fini vers la démarche. Reformulez les consignes hors classe pour qu’elles s’appuient sur le vécu de la classe, une observation personnelle ou une prise de position. Ramenez en classe le cœur du travail : premier jet, échanges, oral. Et quand l’IA a sa place, faites-en un objet de discussion : les élèves comparent ses propositions avec leur propre travail, et vous éclairez ce qu’elle a vu ou manqué. Voir l’idée « L’IA, coéquipière d’idées et de relecture ».","Profils":"Enseignants","Source":"Supports de formation ISFEC","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ22","Thème":"En classe et avec les élèves","Question":"Un élève a rendu un devoir fait avec l’IA : que faire ?","Réponse":"Plutôt que de chercher à le prendre en faute, ouvrez le dialogue : demandez-lui d’expliquer à l’oral sa démarche et ses choix, et rappelez-lui que ce qu’il rend, il le signe. Utiliser une IA sans autorisation et sans travail personnel est une fraude, à expliquer clairement aux élèves. Puis faites évoluer vos consignes et vos critères pour rendre le raisonnement visible.","Profils":"Enseignants","Source":"Support élèves (ISFEC) ; cadre d’usage (extraits présentés en formation)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ23","Thème":"En classe et avec les élèves","Question":"J’aimerais davantage différencier mes enseignements. Comment l’IA peut-elle m’aider ?","Réponse":"L’IA peut vous faire gagner du temps pour préparer plusieurs versions d’un même support : un texte reformulé à plusieurs niveaux de lecture, des exercices gradués, des coups de pouce. Précisez dans votre prompt le niveau, l’objectif et les besoins visés (méthode RACE), sans jamais nommer ni décrire un élève. Vous restez celui qui connaît vos élèves : vérifiez et ajustez chaque support avant de l’utiliser.","Profils":"Enseignants","Source":"Supports de formation ISFEC","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ24","Thème":"En classe et avec les élèves","Question":"Je souhaite organiser un projet pluridisciplinaire avec des collègues. Comment l’IA peut-elle nous accompagner ?","Réponse":"Elle peut aider l’équipe à trouver des idées de thèmes, à repérer des points de rencontre entre les programmes, à proposer une première trame de déroulé ou un rétroplanning, et à harmoniser des consignes communes. Elle reste un appui : c’est l’équipe qui choisit, ajuste et porte le projet. Pensez à utiliser un outil autorisé par l’établissement.","Profils":"Enseignants","Source":"Supports de formation ISFEC","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["ens"]},{"ID":"FAQ25","Thème":"En classe et avec les élèves","Question":"Je souhaite sensibiliser les élèves à l’usage de l’IA. Par quoi commencer ?","Réponse":"Partez de leurs usages : ils utilisent déjà l’IA, pour le travail scolaire mais aussi pour des sujets personnels. Puis, selon l’âge : comprendre comment elle fonctionne (des activités débranchées dès l’école), exercer l’esprit critique (vrai, vraisemblable ou faux ?), protéger ses données (« Ce que tu saisis ne t’appartient plus »). À partir de la 4e, les élèves peuvent manipuler en classe, de façon encadrée. Voir les idées de la porte « Je passe à l’action ».","Profils":"Enseignants, CPE","Source":"Support élèves et support conférence parents (ISFEC)","Origine":"Formation","Mise à jour":"","Fréquente":"","profilsCodes":["ens","cpe"]},{"ID":"FAQ26","Thème":"Avec les familles","Question":"Comment parler de l’IA aux familles ?","Réponse":"Proposez un temps d’échange simple et rassurant, en quatre étapes : partir de ce que les parents en pensent et de ce que leurs enfants en font, expliquer comment ça marche, mesurer ensemble les défis et les opportunités, puis donner des pistes pour accompagner sereinement à la maison. Le support « Enfants, parents et IA : comprendre et guider » de l’ISFEC suit exactement cette trame.","Profils":"Chefs d’établissement, enseignants","Source":"Support conférence parents (ISFEC)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens"]},{"ID":"FAQ27","Thème":"Avec les familles","Question":"Un parent craint que son enfant triche avec l’IA. Que lui répondre ?","Réponse":"Rassurez-le : l’établissement a des règles claires, et les enseignants font évoluer leurs consignes et leurs évaluations pour valoriser la démarche plutôt que le seul résultat. Invitez-le à en parler avec son enfant : ce qu’il rend, il le signe. L’IA peut aider à comprendre ou à réviser, à condition que l’élève fasse le travail de réflexion.","Profils":"Chefs d’établissement, enseignants, CPE","Source":"Supports de formation ISFEC","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens","cpe"]},{"ID":"FAQ28","Thème":"Avec les familles","Question":"Un parent découvre que son enfant confie ses soucis à une IA. Que lui conseiller ?","Réponse":"C’est fréquent : près d’un jeune sur deux dit utiliser l’IA pour parler de sujets intimes ou personnels. Conseillez d’en parler avec l’enfant, sans dramatiser : une IA n’est pas un confident, elle ne remplace pas un adulte de confiance, et ce qu’on y saisit ne nous appartient plus. Si l’enfant semble en souffrance, orientez la famille vers le CPE, l’infirmière ou le psychologue de l’établissement.","Profils":"CPE, chefs d’établissement, enseignants","Source":"Support conférence parents (ISFEC, d’après une étude Ipsos BVA pour le groupe VYV et la CNIL)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens","cpe"]},{"ID":"FAQ29","Thème":"Avec les familles","Question":"Faut-il interdire l’IA à la maison ?","Réponse":"Interdire est rarement efficace : mieux vaut accompagner. Utiliser l’IA ensemble, fixer des règles (pour quoi faire, combien de temps, quelles données ne jamais saisir), et choisir des outils plus respectueux de la vie privée et plus sobres, comme ceux présentés en formation (Compar:IA, Vittascience, Duck AI, EURIA).","Profils":"Tous","Source":"Support conférence parents (ISFEC)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ30","Thème":"Avec les familles","Question":"À partir de quel âge un enfant peut-il utiliser une IA ?","Réponse":"La formation déconseille de faire manipuler une IA générative aux enfants de moins de 13 ans, âge minimum fixé aussi par la plupart des services : vérifiez leurs conditions d’utilisation. À l’école, l’usage par les élèves est possible en classe à partir de la 4e, de façon encadrée. Avant, on sensibilise sans manipuler.","Profils":"Tous","Source":"Formation ISFEC ; cadre d’usage (extraits présentés en formation)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["tous"]},{"ID":"FAQ31","Thème":"Avec les familles","Question":"Faut-il informer les familles quand l’IA est utilisée en classe ?","Réponse":"Oui, c’est une bonne pratique de transparence : présentez les règles d’usage de l’établissement, par exemple dans la charte ou lors de la réunion de rentrée, en précisant que l’usage par les élèves est encadré et ne commence qu’en 4e. Si un outil traite des données personnelles, l’information des personnes concernées est obligatoire.","Profils":"Chefs d’établissement, enseignants","Source":"Atelier vie scolaire et CPE (ISFEC) ; cadre d’usage","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens"]},{"ID":"FAQ32","Thème":"Piloter l’établissement","Question":"Par où commencer dans mon établissement ?","Réponse":"Commencez par un état des lieux, sans jugement : quels outils les personnels utilisent-ils déjà, pour quoi faire, avec quels doutes ? Repérez ensuite les besoins de formation de l’équipe et fixez deux ou trois priorités. Un petit groupe moteur (enseignant référent, CPE, enseignant volontaire) peut porter la démarche avec vous.","Profils":"Chefs d’établissement","Source":"Supports de formation ISFEC","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir"]},{"ID":"FAQ33","Thème":"Piloter l’établissement","Question":"Faut-il une charte d’usage de l’IA ?","Réponse":"C’est vivement recommandé. Coconstruisez-la avec l’équipe à partir du cadre national, de la charte informatique et du règlement intérieur, en distinguant les usages avec les élèves et les usages professionnels. Les élèves, à partir de la 4e, peuvent y contribuer. Faites-la valider par le conseil d’établissement ou le conseil d’école.","Profils":"Chefs d’établissement, enseignants","Source":"Supports de formation ISFEC ; cadre d’usage","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens"]},{"ID":"FAQ34","Thème":"Piloter l’établissement","Question":"Comment embarquer des collègues réticents ?","Réponse":"Partez de leurs questions et prenez leurs réserves au sérieux : elles sont souvent légitimes (éthique, environnement, sens du métier). Ne cherchez pas à convaincre d’utiliser l’IA à tout prix : montrez des usages concrets et utiles, mais aussi des activités sans IA. Les temps d’échange entre pairs, où chacun présente une pratique ou une question, fonctionnent mieux qu’une démonstration.","Profils":"Chefs d’établissement, enseignants","Source":"Supports de formation ISFEC","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir","ens"]},{"ID":"FAQ35","Thème":"Piloter l’établissement","Question":"Comment repérer les besoins de formation de mon équipe ?","Réponse":"Proposez un auto-positionnement individuel et anonyme, par exemple à partir d’un court quiz, puis faites émerger les grandes tendances en équipe. Le référentiel de compétences en IA de l’UNESCO, avec ses trois niveaux (acquérir, approfondir, créer), aide chacun à situer son point de départ et l’équipe à choisir ses priorités.","Profils":"Chefs d’établissement","Source":"Référentiel de compétences en IA pour les enseignants (UNESCO)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir"]},{"ID":"FAQ36","Thème":"Piloter l’établissement","Question":"Qui consulter avant d’adopter un outil d’IA dans l’établissement ?","Réponse":"L’adoption d’un outil est une décision de l’établissement (et de l’OGEC dans l’enseignement catholique), à prendre avec l’avis du DPO pour la conformité au RGPD, après consultation du CSE quand l’outil concerne les personnels. Les personnes concernées doivent être informées de son usage. Dans le doute, rapprochez-vous de votre direction diocésaine.","Profils":"Chefs d’établissement","Source":"Atelier vie scolaire et CPE (ISFEC)","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir"]},{"ID":"FAQ37","Thème":"Piloter l’établissement","Question":"Comment intégrer l’IA au projet d’établissement ?","Réponse":"Partez de vos valeurs plutôt que des outils. Magnifica humanitas propose une boussole : la dignité de la personne comme critère de tout progrès. L’IA peut alors s’inscrire dans des axes éducatifs existants (esprit critique, citoyenneté numérique, sobriété, relation éducative), avec quelques actions concrètes et des indicateurs simples pour suivre leur mise en œuvre.","Profils":"Chefs d’établissement","Source":"Magnifica humanitas ; supports de formation ISFEC","Origine":"Proposée","Mise à jour":"","Fréquente":"","profilsCodes":["dir"]}],"fiches":[{"ID":"F1","Titre":"Comment fonctionne une IA générative ?","Durée de lecture":"8 min de lecture, puis un quiz","Sources":"support de formation équipe éducative (ISFEC) ; Référentiel de compétences en IA pour les enseignants (UNESCO)","L'essentiel":"Une IA générative ne cherche pas « la bonne réponse » : elle calcule, mot après mot, la suite la plus probable d’un texte. Elle produit un langage fluide et convaincant, sans comprendre ce qu’elle écrit. C’est pour cela qu’elle peut être très utile et se tromper avec assurance.","Contenu (Markdown)":"### Ce qu’elle fait vraiment\n\n- Elle **prédit le mot suivant**, puis le suivant, et ainsi de suite.\n- Elle **calcule des probabilités** à partir de ce qu’elle a appris.\n- Elle **génère du contenu en langage humain** : texte, image, son.\n- Elle **ne comprend pas le sens** de ce qu’elle produit.\n\n### D’où vient ce qu’elle sait\n\nSon carburant, ce sont les **données** : d’immenses quantités de textes et d’images. Son moteur, ce sont des **algorithmes** qui s’entraînent sur ces données pour former un grand modèle de langage. Ce qu’elle produit reflète donc ses données, avec leurs richesses mais aussi leurs oublis et leurs biais.\n\n### Trois traits à connaître\n\n- **Elle varie** : la même question peut donner des réponses différentes, car le calcul est probabiliste.\n- **Elle répond coûte que coûte** : plutôt que de dire « je ne sais pas », elle peut inventer une information, une citation ou une source. On parle d’hallucination.\n- **Elle va dans votre sens** : sa réponse suit votre demande et se veut persuasive, même quand la demande part d’une idée fausse.","À retenir":"une réponse bien écrite n’est pas une réponse vraie. Vérifiez, comparez avec d’autres sources et gardez la main : c’est vous l’expert.","Mise à jour":""},{"ID":"F2","Titre":"Bien rédiger un prompt : la méthode RACE","Durée de lecture":"5 min de lecture, puis un quiz","Sources":"supports de formation ISFEC (équipe éducative, conférence parents)","L'essentiel":"Un prompt, c’est la consigne que vous donnez à une IA. Plus elle est précise, plus la réponse est utile. La méthode RACE vous aide à n’oublier aucun ingrédient.","Contenu (Markdown)":"### Les quatre ingrédients\n\n- **R comme Rôle** : qui l’IA doit-elle incarner ? Ex. : « Tu es responsable de la vie scolaire d’un lycée. »\n- **A comme Action** : que doit-elle faire, précisément ? Ex. : « Rédige un mail à destination des familles. »\n- **C comme Cadre ou contexte** : pour qui, quand, avec quelles contraintes ? Ex. : « Pour la journée pédagogique du 13/11, ton chaleureux, 10 lignes maximum. »\n- **E comme Exemple** : montrez le résultat attendu, si vous en avez un. Ex. : un mail des années précédentes qui vous plaît.\n\n### Avant, après\n\n- Avant : « Fais un mail aux familles pour la journée pédagogique. »\n- Après : « Tu es responsable de la vie scolaire d’un lycée. Rédige pour la prochaine journée pédagogique, qui aura lieu le 13/11, un mail à destination des familles. Utilise un ton chaleureux, 10 lignes maximum, avec les informations importantes en gras. »","À retenir":"relisez toujours la réponse. Ce que vous envoyez, c’est vous qui le signez.","Mise à jour":""},{"ID":"F3","Titre":"Le cadre d’usage de l’IA en éducation","Durée de lecture":"10 min de lecture, puis un quiz","Sources":"cadre d’usage de l’IA en éducation (extraits présentés en formation) ; atelier vie scolaire et CPE et support équipe éducative (ISFEC)","L'essentiel":"Avant d’utiliser une IA, une seule question : est-ce possible, pertinent, souhaitable et autorisé ? Ce n’est pas parce qu’un outil sait faire quelque chose qu’il faut s’en servir. Le cadre d’usage national, l’établissement employeur et le règlement européen sur l’IA posent ensemble les règles du jeu.","Contenu (Markdown)":"### Quatre filtres avant d’utiliser l’IA\n\n- **Possible** : l’outil sait le faire.\n- **Pertinent** : il sert un objectif précis.\n- **Souhaitable** : c’est cohérent avec nos valeurs.\n- **Autorisé** : c’est conforme au cadre.\n\n### Trois cadres à garder en tête\n\n- **Le cadre national** (Éducation nationale) : des repères pédagogiques, éthiques, juridiques et environnementaux.\n- **L’employeur** : la charte informatique de l’établissement, la protection des données avec le DPO, la consultation des instances du personnel pour certains outils.\n- **Le règlement européen sur l’IA (AI Act)** : il classe les usages par niveau de risque et impose la transparence. L’évaluation et l’orientation des élèves y font partie des usages à haut risque.\n\n### Avec les élèves, selon l’âge\n\n- **Au 1er degré** : les élèves sont sensibilisés aux bases de l’IA, sans manipuler eux-mêmes d’IA générative.\n- **À partir de la 4e** : l’usage par les élèves est possible en classe, de façon limitée, encadrée, expliquée et accompagnée par le professeur.\n- **Au lycée** : les élèves peuvent l’utiliser de façon autonome, dans un cadre défini explicitement par le professeur.\n\n### Devoirs et évaluation\n\n- Mettez au premier plan le raisonnement et la démarche.\n- Expliquez aux élèves qu’utiliser une IA pour un devoir, sans autorisation et sans travail personnel d’appropriation, est une fraude.\n- Évitez les logiciels de détection de textes générés par IA : peu fiables, ils pourraient pénaliser un élève à tort.","À retenir":"n’utilisez l’IA que lorsque la plus-value pédagogique est réelle, et renoncez-y si vous ne pouvez pas vérifier le résultat. Une décision qui concerne un élève reste toujours humaine.","Mise à jour":""},{"ID":"F4","Titre":"Protéger les données personnelles","Durée de lecture":"6 min de lecture, puis un quiz","Sources":"atelier vie scolaire et CPE, support équipe éducative et support élèves (ISFEC)","L'essentiel":"Ce que vous saisissez dans une IA ne vous appartient plus. La règle est simple : jamais de données personnelles, ni les vôtres, ni celles des élèves, des familles ou des collègues, dans un outil d’IA grand public.","Contenu (Markdown)":"### Qu’est-ce qu’une donnée personnelle ?\n\nToute information qui permet d’identifier une personne, directement ou par recoupement : nom, photo, adresse, notes, absences, situation familiale, santé, comportement… Un document public, comme le règlement intérieur, n’en contient pas.\n\n### Les bons réflexes\n\n- **Travaillez avec des données fictives** : faites construire un modèle de tableau par l’IA avec des exemples inventés, puis saisissez les vraies données dans le tableur, sans IA.\n- **Nettoyez vos documents** avant de les confier à un outil : ni nom, ni identifiant, ni consigne de sécurité.\n- **Pour un outil nouveau** (par exemple la transcription de réunions) : c’est à l’établissement de décider, avec l’avis du DPO, la vérification de la conformité au RGPD et l’information des personnels.\n\n### Une décision sur un élève reste humaine\n\nPrédire le décrochage d’un élève à partir de ses notes et absences, c’est du profilage au sens du RGPD, et l’évaluation des élèves est un usage à haut risque pour le règlement européen sur l’IA. L’IA ne décide pas à la place des adultes.\n\n### Avec les élèves\n\nLes jeunes confient beaucoup aux IA : selon une étude Ipsos BVA pour le groupe VYV et la CNIL, 48 % des 11-25 ans interrogés s’en servent pour parler de sujets intimes et personnels. Un message à leur transmettre : « Ce que tu saisis ne t’appartient plus. »","À retenir":"dans le doute, n’y mettez rien de personnel. Données fictives, documents nettoyés, et décisions humaines.","Mise à jour":""},{"ID":"F5","Titre":"Enjeux éthiques et environnementaux de l’IA","Durée de lecture":"8 min de lecture, puis un quiz","Sources":"lettre encyclique Magnifica humanitas (Léon XIV, 2026) et son infographie ; support conférence parents et support élèves (ISFEC) ; Référentiel de compétences en IA pour les enseignants (UNESCO)","L'essentiel":"L’IA n’est ni neutre ni gratuite. Elle pose des questions de vérité, de relation humaine, de justice et d’environnement. Magnifica humanitas propose une boussole simple : la dignité de la personne doit être le critère de tout progrès. Guidée par la sagesse, la technique sert le développement humain ; si elle domine, l’humain devient un moyen.","Contenu (Markdown)":"### Ce que l’IA n’est pas\n\nL’IA imite certaines fonctions de l’intelligence humaine, souvent plus vite et à plus grande échelle. Mais elle ne vit pas d’expérience, n’a pas de conscience morale et ne comprend pas ce qu’elle produit. Elle peut simuler l’empathie, pas l’éprouver. Juger, accompagner, prendre une décision qui engage une personne restent des responsabilités humaines.\n\n### Vérité et esprit critique\n\n- L’IA reflète les **biais** de ses données : stéréotypes, oublis, points de vue dominants.\n- Elle facilite la **désinformation** et les **hypertrucages** (deepfakes) : images, voix et vidéos fabriquées.\n- La réponse éducative : esprit critique, transparence sur les usages, vérification des sources.\n\n### L’école et la relation\n\nMagnifica humanitas rappelle que l’école n’a pas à courir après la rapidité du numérique : elle offre ce que le numérique seul ne peut donner, du temps partagé pour apprendre et des relations de confiance. Accompagner les jeunes à utiliser les technologies de façon responsable fait partie de la mission éducative.\n\n### Le coût environnemental\n\n- Les systèmes d’IA consomment de l’**énergie**, de l’**eau** et des **ressources**, et émettent du CO2 (Magnifica humanitas, §101).\n- Entraîner et faire fonctionner un grand modèle mobilise de 30 000 à 50 000 cartes graphiques (repère présenté en formation).\n- La demande en électricité liée à l’IA pourrait augmenter de 1,5 à 3 % d’ici 2030, et l’empreinte carbone des centres de données doubler (The Shift Project, AIE, cités en formation).\n- Une requête isolée consomme peu, mais les usages se multiplient : c’est la somme des gestes qui compte.","À retenir":"avant d’ouvrir une IA, une question : avez-vous besoin de l’IA pour cette question ? Et pour chaque usage : sert-il vraiment la personne, l’élève, la relation ?","Mise à jour":""}],"quiz":[{"Fiche":"F1","N°":"1","Question":"Que fait une IA générative quand elle écrit un texte ?","Réponse A":"Elle cherche la réponse dans une base de vérités.","Réponse B":"Elle comprend la question comme un humain.","Réponse C":"Elle prédit, mot après mot, la suite la plus probable.","Réponse D":"Elle recopie un site internet.","Bonne réponse":"C","Explication":"Elle calcule la suite la plus probable d’un texte, sans comprendre ce qu’elle écrit."},{"Fiche":"F1","N°":"2","Question":"Vous posez deux fois la même question à une IA. Que se passe-t-il ?","Réponse A":"Vous obtenez toujours exactement la même réponse.","Réponse B":"L’IA refuse de répondre une deuxième fois.","Réponse C":"La réponse est traduite dans une autre langue.","Réponse D":"Les réponses peuvent varier.","Bonne réponse":"D","Explication":"Le calcul est probabiliste : une même demande peut donner des réponses différentes."},{"Fiche":"F1","N°":"3","Question":"Une réponse bien rédigée et sûre d’elle est forcément exacte.","Réponse A":"Faux.","Réponse B":"Vrai.","Réponse C":"","Réponse D":"","Bonne réponse":"A","Explication":"L’IA répond coûte que coûte et peut inventer une information ou une source : c’est une hallucination."},{"Fiche":"F1","N°":"4","Question":"Quel est le « carburant » d’une IA générative ?","Réponse A":"Des règles de grammaire écrites à la main.","Réponse B":"Les données sur lesquelles elle a été entraînée.","Réponse C":"Les émotions des utilisateurs.","Réponse D":"Une encyclopédie vérifiée par des experts.","Bonne réponse":"B","Explication":"Elle apprend à partir d’immenses quantités de données, dont elle reflète aussi les biais et les oublis."},{"Fiche":"F1","N°":"5","Question":"Vous demandez à une IA de confirmer une idée fausse. Que risque-t-elle de faire ?","Réponse A":"Vous corriger systématiquement.","Réponse B":"Aller dans votre sens avec une réponse convaincante.","Réponse C":"Signaler l’erreur à votre établissement.","Réponse D":"Bloquer la conversation.","Bonne réponse":"B","Explication":"Sa réponse suit votre demande et se veut persuasive : formulez des questions neutres et gardez votre esprit critique."},{"Fiche":"F2","N°":"1","Question":"Qu’est-ce qu’un prompt ?","Réponse A":"Un logiciel d’IA.","Réponse B":"Une réponse produite par l’IA.","Réponse C":"Un réglage de confidentialité.","Réponse D":"La consigne précise que l’on donne à une IA.","Bonne réponse":"D","Explication":"Le prompt est la consigne : sa qualité conditionne celle de la réponse."},{"Fiche":"F2","N°":"2","Question":"Dans la méthode RACE, à quoi correspond le C ?","Réponse A":"Une consigne.","Réponse B":"Une conclusion.","Réponse C":"Le cadre ou le contexte.","Réponse D":"Un critère d’évaluation.","Bonne réponse":"C","Explication":"Le cadre précise pour qui, quand et avec quelles contraintes (ton, longueur, format)."},{"Fiche":"F2","N°":"3","Question":"« Tu es responsable de la vie scolaire d’un lycée. » Quel ingrédient de RACE est-ce ?","Réponse A":"Rôle.","Réponse B":"Action.","Réponse C":"Cadre.","Réponse D":"Exemple.","Bonne réponse":"A","Explication":"Cette phrase indique à l’IA quel rôle elle doit incarner."},{"Fiche":"F2","N°":"4","Question":"Lequel de ces prompts est le plus précis ?","Réponse A":"« Fais un exercice sur la Révolution. »","Réponse B":"« Rédige un exercice de chronologie en 3 étapes sur la Révolution française, pour une classe de 4e, avec un coup de pouce pour les élèves en difficulté. »","Réponse C":"« Exercice Révolution 4e. »","Réponse D":"« Aide-moi pour mon cours d’histoire. »","Bonne réponse":"B","Explication":"Il précise l’action, le niveau, le contenu et une différenciation : l’IA a de quoi produire une réponse utile."},{"Fiche":"F2","N°":"5","Question":"Une fois la réponse obtenue avec un bon prompt, que faites-vous ?","Réponse A":"Je l’utilise telle quelle, le prompt était précis.","Réponse B":"Je la transmets directement aux familles.","Réponse C":"Je la supprime par principe.","Réponse D":"Je la relis, la vérifie et l’ajuste avant de l’utiliser.","Bonne réponse":"D","Explication":"Même avec un excellent prompt, la réponse peut contenir des erreurs : c’est vous qui signez ce que vous envoyez."},{"Fiche":"F3","N°":"1","Question":"À partir de quel niveau les élèves peuvent-ils utiliser une IA générative en classe, encadrés par le professeur ?","Réponse A":"CP.","Réponse B":"CM2.","Réponse C":"4e.","Réponse D":"Seconde.","Bonne réponse":"C","Explication":"Le cadre d’usage autorise un usage en classe à partir de la 4e, limité, encadré et accompagné."},{"Fiche":"F3","N°":"2","Question":"Au 1er degré, que prévoit le cadre d’usage ?","Réponse A":"Les élèves sont sensibilisés à l’IA sans manipuler d’IA générative.","Réponse B":"Les élèves utilisent librement l’IA générative.","Réponse C":"On ne parle jamais d’IA.","Réponse D":"L’IA est réservée aux devoirs à la maison.","Bonne réponse":"A","Explication":"La sensibilisation passe par des activités sans manipulation directe, par exemple des activités débranchées."},{"Fiche":"F3","N°":"3","Question":"Que penser des logiciels qui détectent les textes générés par une IA ?","Réponse A":"Ce sont des preuves fiables.","Réponse B":"Ils sont obligatoires pour corriger.","Réponse C":"Ils remplacent l’évaluation.","Réponse D":"Ils sont à éviter, car peu fiables.","Bonne réponse":"D","Explication":"Peu fiables, ils pourraient conduire à pénaliser un élève à tort. Mieux vaut évaluer la démarche."},{"Fiche":"F3","N°":"4","Question":"Vous voulez déposer le règlement intérieur dans un outil d’IA grand public pour créer un assistant. Est-ce conforme ?","Réponse A":"Non, jamais.","Réponse B":"Oui, c’est un document public.","Réponse C":"Seulement avec l’accord des familles.","Réponse D":"Seulement au lycée.","Bonne réponse":"B","Explication":"Un document public peut être utilisé dans un outil grand public. Des données personnelles d’élèves, jamais."},{"Fiche":"F3","N°":"5","Question":"Un outil sait réaliser une tâche. Cela suffit-il pour l’utiliser ?","Réponse A":"Oui, s’il est gratuit.","Réponse B":"Oui, si un collègue l’utilise déjà.","Réponse C":"Non : l’usage doit aussi être pertinent, souhaitable et autorisé.","Réponse D":"Oui, si la réponse est rapide.","Bonne réponse":"C","Explication":"Possible ne veut pas dire pertinent, souhaitable ni autorisé : les quatre filtres comptent."},{"Fiche":"F4","N°":"1","Question":"Peut-on déposer les notes et les absences d’une classe dans une IA grand public pour repérer les élèves qui risquent de décrocher ?","Réponse A":"Oui, c’est plus rapide.","Réponse B":"Oui, si l’outil est payant.","Réponse C":"Oui, avec l’accord oral des élèves.","Réponse D":"Non : ce sont des données personnelles, et une décision sur un élève reste humaine.","Bonne réponse":"D","Explication":"C’est interdit dans un outil grand public, et c’est du profilage : l’évaluation des élèves est un usage à haut risque."},{"Fiche":"F4","N°":"2","Question":"Vous voulez un tableau de bord de suivi des élèves. Quelle est la bonne pratique ?","Réponse A":"Faire construire le modèle avec des données fictives, puis saisir les vraies dans le tableur, sans IA.","Réponse B":"Donner les vraies données à l’IA pour qu’elle remplisse le tableau.","Réponse C":"Demander aux élèves de remplir le tableau avec l’IA.","Réponse D":"Renoncer à tout tableau.","Bonne réponse":"A","Explication":"Les données fictives permettent de profiter de l’IA sans exposer aucune donnée réelle."},{"Fiche":"F4","N°":"3","Question":"Lequel de ces éléments n’est pas une donnée personnelle ?","Réponse A":"La photo d’un élève.","Réponse B":"Les absences d’un élève.","Réponse C":"Le règlement intérieur de l’établissement.","Réponse D":"L’adresse d’une famille.","Bonne réponse":"C","Explication":"Le règlement intérieur est un document public : il peut être utilisé dans un outil grand public."},{"Fiche":"F4","N°":"4","Question":"Votre équipe voudrait un outil d’IA qui transcrit les réunions. Que faire d’abord ?","Réponse A":"L’installer et le tester en réunion.","Réponse B":"Demander l’avis d’un collègue qui l’utilise.","Réponse C":"Rien, ce n’est pas un usage pédagogique.","Réponse D":"Laisser l’établissement décider, avec l’avis du DPO et la vérification de la conformité au RGPD.","Bonne réponse":"D","Explication":"Un outil qui traite la voix et les propos des personnels relève d’une décision de l’établissement, en lien avec le DPO."},{"Fiche":"F4","N°":"5","Question":"Quel message transmettre aux élèves ?","Réponse A":"« Ce que tu saisis ne t’appartient plus. »","Réponse B":"« L’IA oublie tout ce que tu lui dis. »","Réponse C":"« Tes données sont toujours protégées. »","Réponse D":"« Seules les photos sont sensibles. »","Bonne réponse":"A","Explication":"Tout ce qui est saisi peut être conservé et réutilisé : jamais de données personnelles, ni les siennes ni celles des autres."},{"Fiche":"F5","N°":"1","Question":"Selon Magnifica humanitas, quel doit être le critère de tout progrès ?","Réponse A":"La rapidité.","Réponse B":"La rentabilité.","Réponse C":"La dignité de la personne.","Réponse D":"La nouveauté.","Bonne réponse":"C","Explication":"L’encyclique place la dignité de la personne au cœur de l’évaluation de toute innovation."},{"Fiche":"F5","N°":"2","Question":"Une IA a-t-elle une conscience morale ?","Réponse A":"Oui, elle distingue le bien du mal.","Réponse B":"Seulement les modèles les plus récents.","Réponse C":"Oui, si elle est bien paramétrée.","Réponse D":"Non : elle imite, sans comprendre ni assumer les conséquences.","Bonne réponse":"D","Explication":"Elle peut simuler la compréhension ou l’empathie, mais le jugement et la responsabilité restent humains."},{"Fiche":"F5","N°":"3","Question":"D’où viennent le plus souvent les biais d’une IA ?","Réponse A":"Des données sur lesquelles elle a été entraînée.","Réponse B":"De l’écran utilisé.","Réponse C":"De la qualité de la connexion.","Réponse D":"Uniquement des utilisateurs.","Bonne réponse":"A","Explication":"L’IA reproduit les stéréotypes et les oublis présents dans ses données d’entraînement."},{"Fiche":"F5","N°":"4","Question":"Quel est le geste le plus sobre ?","Réponse A":"Reposer plusieurs fois la même question pour comparer.","Réponse B":"Se demander si l’IA est utile et chercher d’abord ailleurs (cours, FAQ, collègue).","Réponse C":"Générer une image pour chaque diapositive.","Réponse D":"Laisser l’IA reformuler tous ses mails.","Bonne réponse":"B","Explication":"La requête la plus sobre est celle qu’on ne fait pas quand elle n’apporte rien."},{"Fiche":"F5","N°":"5","Question":"Face au numérique, quel rôle Magnifica humanitas donne-t-elle à l’école ?","Réponse A":"Suivre le rythme des technologies.","Réponse B":"Remplacer les cours par des outils d’IA.","Réponse C":"Offrir du temps partagé pour apprendre et des relations de confiance.","Réponse D":"Interdire tout outil numérique.","Bonne réponse":"C","Explication":"L’école offre ce que le numérique seul ne peut donner, et accompagne les jeunes vers un usage responsable."}],"idees":[{"ID":"CC1","Coup de cœur":"Oui","Niveau":"Classe","Titre":"Le robot obéissant","Public (texte de la fiche)":"Cycles 2 et 3","Degré":"1er degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"élèves","Objectif":"comprendre, en riant, qu’une machine exécute les consignes à la lettre, et qu’une consigne doit être précise.","Étapes":"1. Un volontaire joue le robot : il ne fait que ce qu’on lui dit, mot pour mot, sans rien deviner.\n2. La classe lui dicte une tâche simple : dessiner une maison au tableau, ranger une trousse, traverser la classe.\n3. Le robot exécute à la lettre : les ratés font rire et montrent ce qui manquait.\n4. Par groupes, les élèves réécrivent les instructions, puis on teste à nouveau.\n5. Conclusion : une machine ne devine pas ce qu’on veut dire, il faut le lui dire clairement.","Moyens":"un tableau, quelques objets du quotidien.","Indicateur de réussite":"la deuxième version des instructions fonctionne du premier coup.","Point de vigilance":"le robot joue un rôle, on ne se moque jamais de l’élève. Le lien avec l’IA se fait à l’oral, sans écran.","Mise à jour":""},{"ID":"CC2","Coup de cœur":"Oui","Niveau":"Classe","Titre":"Le perroquet savant","Public (texte de la fiche)":"Cycle 3 à la 5e","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"1 h","Pour qui":"élèves","Objectif":"comprendre comment « écrit » un modèle de langage, en choisissant le mot le plus probable.","Étapes":"1. La classe écrit une vingtaine de phrases courtes sur un même thème, par exemple la récréation.\n2. Pour quelques mots de départ, on compte ensemble les mots qui les suivent le plus souvent, dans un tableau de fréquences.\n3. On « génère » de nouvelles phrases en choisissant à chaque fois le mot suivant le plus fréquent, ou en le tirant au sort selon les fréquences.\n4. On lit les phrases produites : lesquelles sont correctes ? Absurdes ? Répétitives ?\n5. Débat : le perroquet comprend-il ce qu’il dit ?","Moyens":"des cartes-mots, un tableau, éventuellement des dés.","Indicateur de réussite":"les élèves expliquent avec leurs mots que la machine choisit le mot le plus probable, sans comprendre.","Point de vigilance":"c’est une simplification, à présenter comme telle.","Mise à jour":""},{"ID":"CC3","Coup de cœur":"Oui","Niveau":"Classe","Titre":"Qui a écrit ça ?","Public (texte de la fiche)":"4e au lycée","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée (textes préparés par le professeur)","Durée":"1 h","Pour qui":"élèves","Objectif":"aiguiser le regard critique sur les textes générés et prendre conscience de la valeur de sa propre voix.","Étapes":"1. Le professeur prépare six courts textes sur un sujet du cours : trois écrits par des élèves (anonymisés, avec leur accord, par exemple d’une autre classe), trois générés par une IA.\n2. Par groupes, les élèves enquêtent : ton, exemples vécus, précision, erreurs, généralités.\n3. Chaque groupe vote, puis le professeur révèle les auteurs.\n4. Discussion : qu’est-ce qui rend un texte personnel ? Qu’est-ce que la machine ne pouvait pas savoir ?","Moyens":"six textes imprimés, une grille d’indices.","Indicateur de réussite":"chaque élève cite un élément qui rend son écriture unique.","Point de vigilance":"pas de chasse au tricheur ni de détecteur. Les textes d’élèves sont anonymisés et utilisés avec leur accord.","Mise à jour":""},{"ID":"CC4","Coup de cœur":"Oui","Niveau":"Classe","Titre":"Le procès de l’IA","Public (texte de la fiche)":"4e au lycée (EMC, français, philosophie)","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"2 séances de 1 h","Pour qui":"élèves","Objectif":"argumenter sur un enjeu éthique et comprendre que la responsabilité reste humaine.","Étapes":"1. Le professeur présente une affaire fictive : un montage a circulé, une IA a écarté une candidature, un devoir a été entièrement généré.\n2. Les rôles sont répartis : accusation, défense, témoins (concepteur, utilisateur, personne lésée), jurés.\n3. Chaque équipe prépare ses arguments avec des documents fournis (cadre d’usage, extraits de Magnifica humanitas, articles).\n4. Audience, délibération des jurés, verdict.\n5. Débriefing : l’IA peut-elle être coupable ? Qui est responsable ?","Moyens":"un dossier documentaire, une salle aménagée en tribunal.","Indicateur de réussite":"les élèves distinguent les responsabilités du concepteur, de l’utilisateur et de l’institution.","Point de vigilance":"l’affaire reste fictive, sans lien avec des personnes réelles de l’établissement.","Mise à jour":""},{"ID":"CC5","Coup de cœur":"Oui","Niveau":"Vie scolaire","Titre":"Le musée des erreurs","Public (texte de la fiche)":"Collège et lycée","Degré":"2nd degré","Format":"Les deux","Format (détail)":"Avec ou sans outil numérique","Durée":"Toute l’année","Pour qui":"professeur documentaliste, CPE, enseignants, élèves","Objectif":"collecter et exposer les erreurs et les biais des IA, pour apprendre à les repérer.","Étapes":"1. Un espace d’exposition est ouvert au CDI : panneau, vitrine ou mur.\n2. Adultes et élèves (à partir de la 4e, dans le cadre de la classe) déposent la capture d’une réponse d’IA fausse ou biaisée.\n3. Chaque pièce a son cartel : la question posée, l’erreur, la bonne information avec sa source, une hypothèse sur l’origine de l’erreur.\n4. Une sélection est renouvelée chaque mois ; un vernissage peut réunir les familles.","Moyens":"un espace d’affichage, des cartels à remplir.","Indicateur de réussite":"une vingtaine de pièces exposées dans l’année.","Point de vigilance":"aucune donnée personnelle sur les captures. Chaque correction est vérifiée avant d’être exposée.","Mise à jour":""},{"ID":"CC6","Coup de cœur":"Oui","Niveau":"Classe","Titre":"L’escape game de l’esprit critique","Public (texte de la fiche)":"Collège","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée (textes préparés par le professeur)","Durée":"1 h","Pour qui":"élèves, professeur, professeur documentaliste","Objectif":"entraîner, par le jeu, le réflexe de vérifier une information bien rédigée.","Étapes":"1. Le professeur prépare quatre ou cinq énigmes. Chacune contient un court texte présenté comme généré par une IA, avec une erreur cachée : une date, un chiffre, une citation inventée, un biais.\n2. Pour obtenir le code de l’énigme suivante, l’équipe doit trouver l’erreur et la corriger grâce à une source fournie (manuel, dictionnaire, document).\n3. La première équipe qui ouvre le dernier cadenas gagne.\n4. Débriefing : quels types d’erreurs avons-nous trouvés ? Quels indices nous ont alertés ?","Moyens":"des enveloppes ou des cadenas à code, des documents de référence.","Indicateur de réussite":"chaque équipe sait nommer trois types d’erreurs d’IA.","Point de vigilance":"les textes piégés sont préparés par le professeur. Les élèves ne génèrent rien eux-mêmes avant la 4e.","Mise à jour":""},{"ID":"CC7","Coup de cœur":"Oui","Niveau":"Classe","Titre":"Ce que l’humain fera toujours","Public (texte de la fiche)":"Cycle 3 au lycée","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"1 h","Pour qui":"élèves","Objectif":"réfléchir à ce qui fait la singularité humaine, en écho à Magnifica humanitas.","Étapes":"1. Lancement par une question : « Qu’est-ce qu’une machine ne pourra jamais faire à ta place ? » Au lycée, on peut partir d’un court extrait de l’encyclique sur la dignité de la personne.\n2. Chaque élève écrit une lettre à l’IA de 2040, pour lui dire ce qu’elle ne fera jamais à sa place, et pourquoi.\n3. Lecture volontaire de quelques lettres.\n4. Les phrases les plus fortes sont affichées sur un mur « Ce que l’humain fera toujours ».","Moyens":"papier, un mur d’affichage.","Indicateur de réussite":"chaque élève nomme au moins une qualité humaine et explique pourquoi elle compte.","Point de vigilance":"accueillir toutes les réponses, sans moraliser ni opposer l’humain et la technique de façon caricaturale.","Mise à jour":""},{"ID":"CC8","Coup de cœur":"Oui","Niveau":"Établissement et équipe","Titre":"Les grands expliquent aux petits","Public (texte de la fiche)":"De la 3e au lycée, vers le CM1 et le CM2","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"Deux séances de préparation et une rencontre","Pour qui":"élèves, enseignants des deux degrés. A faire si vous êtes dans un ensemble scolaire","Objectif":"consolider ce que les grands ont appris en l’expliquant aux plus jeunes, et faire vivre la liaison entre l’école et le collège.","Étapes":"1. Les grands choisissent un jeu débranché : le robot obéissant, le perroquet savant, un tri de cartes.\n2. Ils préparent des consignes adaptées à des écoliers, sans mot technique non expliqué.\n3. Rencontre : les grands animent leurs ateliers auprès des écoliers.\n4. Retour en classe : qu’avons-nous compris en expliquant ?","Moyens":"le matériel des jeux, un temps de rencontre organisé entre les deux établissements.","Indicateur de réussite":"les écoliers savent redire une idée apprise pendant l’atelier.","Point de vigilance":"aucune IA générative manipulée avec les écoliers. Prévoir les autorisations et l’organisation des déplacements.","Mise à jour":""},{"ID":"CC9","Coup de cœur":"Oui","Niveau":"Établissement et équipe","Titre":"Le speed-dating des pratiques","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"équipe pédagogique et éducative","Objectif":"partager usages, réussites et questions sur l’IA dans une ambiance conviviale.","Étapes":"1. Chacun note sur une carte une réussite, un échec instructif ou une question sur l’IA.\n2. En binômes, échange de cinq minutes, puis on change de partenaire au signal, quatre ou cinq fois.\n3. Chacun colle sur un mur l’idée qu’il retient.\n4. L’équipe choisit deux sujets à approfondir lors d’un prochain temps.","Moyens":"des cartes, des post-it, un minuteur.","Indicateur de réussite":"chacun repart avec une idée à tester ou une question à creuser.","Point de vigilance":"une question ou un doute valent autant qu’une réussite. Aucune injonction à utiliser l’IA.","Mise à jour":""},{"ID":"CC10","Coup de cœur":"Oui","Niveau":"Établissement et équipe","Titre":"La semaine « juste ce qu’il faut »","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"Une semaine","Pour qui":"personnels de l’établissement, et élèves volontaires à partir de la 4e","Objectif":"rendre visible la sobriété numérique par un défi collectif.","Étapes":"1. Lancement par une affiche : « Avez-vous besoin de l’IA pour cette question ? »\n2. Pendant une semaine, chacun note dans un mini-carnet les fois où il a utilisé l’IA, celles où il y a renoncé, pourquoi, et par quoi il l’a remplacée.\n3. Bilan collectif : qu’avons-nous découvert ? Pour quelles tâches l’IA était-elle vraiment utile ?\n4. L’équipe retient trois gestes de sobriété, intégrés à la charte d’usage.","Moyens":"une affiche, des mini-carnets, un temps de bilan.","Indicateur de réussite":"trois gestes adoptés et affichés.","Point de vigilance":"défi volontaire et bienveillant, sans culpabiliser personne.","Mise à jour":""},{"ID":"I01","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Poursuivre la rédaction de la charte d’usage de l’IA en équipe","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (facultatif)","Durée":"Deux réunions de 1 h 30","Pour qui":"équipe de direction et enseignants","Objectif":"construire ensemble des repères communs sur l’IA, pour les adultes comme pour les élèves, à partir du cadre national.","Étapes":"1. Un petit groupe (direction, enseignant référent, CPE, un enseignant volontaire) rassemble en amont le cadre d’usage national, la charte informatique et le règlement intérieur.\n2. Première réunion : tour de table sans jugement sur les usages réels et les doutes de chacun.\n3. On repère les points qui demandent une règle commune : outils autorisés, données des élèves, cohérence entre disciplines.\n4. Deuxième réunion : rédaction en petits groupes des grandes orientations, en séparant usages avec les élèves et usages professionnels.\n5. La charte est soumise au conseil d’établissement ou au conseil d’école.","Moyens":"deux réunions, les trois documents de référence, un document partagé.","Indicateur de réussite":"la charte est validée et présentée aux élèves et aux familles avant la fin de l’année.","Point de vigilance":"une charte trop longue n’est pas lue. Visez une page, avec des phrases simples.","Mise à jour":""},{"ID":"I02","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Des consignes qui résistent à l’IA","Public (texte de la fiche)":"2nd degré","Degré":"2nd degré","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (facultatif)","Durée":"45 min","Pour qui":"enseignants, en réunion d’équipe ou de discipline","Objectif":"revoir ses consignes de travail à la maison pour qu’elles demandent une réflexion personnelle, qu’une IA ne peut pas produire à la place de l’élève.","Étapes":"1. Chacun apporte deux ou trois consignes qu’il donne habituellement.\n2. En binômes : une IA pourrait-elle y répondre seule ? Pourquoi ?\n3. On reformule chaque consigne pour qu’elle s’appuie sur ce qui a été vécu en classe, une observation personnelle ou une prise de position.\n4. On met en commun les nouvelles versions dans un document partagé.","Moyens":"45 min, les consignes de chacun, éventuellement une IA autorisée pour tester.","Indicateur de réussite":"chaque participant repart avec au moins une consigne reformulée, utilisée en classe dans le mois.","Point de vigilance":"il ne s’agit pas de durcir les consignes ni de piéger les élèves, mais de les rendre plus utiles à leurs apprentissages. Faire en sorte également que l’évaluation fasse état du processus et du cheminement de l’élève plutôt qu’une tâche finale.","Mise à jour":""},{"ID":"I03","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Une soirée pour informer les familles, si vous ne l’avez pas faite","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (démonstration)","Durée":"1 h 30","Pour qui":"direction, enseignant référent, familles. L’ISFEC peut se charger de ce projet","Objectif":"présenter aux parents les usages de l’IA à l’école et leur donner des pistes pour accompagner leurs enfants.","Étapes":"1. Accueil : ce que les parents pensent de l’IA, ce que leurs enfants en font (sondage à main levée ou nuage de mots).\n2. Comment ça marche, avec une démonstration simple et une erreur d’IA commentée.\n3. Les règles de l’établissement et ce que l’école met en place.\n4. Pistes pour la maison : utiliser ensemble, fixer des règles, protéger ses données, choisir des outils plus respectueux.\n5. Conclusion : chacun note une chose apprise et une chose qu’il changera à la maison.","Moyens":"une salle, un vidéoprojecteur, le support « Enfants, parents et IA : comprendre et guider » de l’ISFEC.","Indicateur de réussite":"à la sortie, la majorité des parents peut citer une règle de l’établissement et un conseil pour la maison.","Point de vigilance":"ton rassurant, ni alarmiste ni enthousiaste. Laissez une vraie place aux questions.","Mise à jour":""},{"ID":"I04","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Les élèves expliquent l’IA à leurs parents","Public (texte de la fiche)":"1er degré (cycles 2 et 3)","Degré":"1er degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"Deux séances de 1 h et un temps avec les familles","Pour qui":"enseignants, élèves, familles","Objectif":"faire des élèves des passeurs entre l’école et la maison, en leur faisant vivre puis animer des jeux sans écran sur le fonctionnement de l’IA.","Étapes":"1. Séance 1 : les élèves vivent deux ou trois jeux débranchés, par exemple deviner le mot qui suit dans une phrase (comme un modèle de langage), ou trier des images selon des critères (comme une machine qu’on entraîne).\n2. Après chaque jeu : « Qu’as-tu compris ? Comment l’expliquerais-tu à quelqu’un qui n’était pas là ? »\n3. Séance 2 : par groupes, les élèves préparent l’animation d’un jeu avec leurs propres mots.\n4. Temps familles : les élèves animent, l’enseignant appuie si besoin, puis échange libre avec les parents.","Moyens":"cartes, images imprimées, une salle pour l’événement.","Indicateur de réussite":"chaque groupe anime son jeu en autonomie devant les familles.","Point de vigilance":"aucune manipulation d’IA générative par les élèves au 1er degré, conformément au cadre d’usage.","Mise à jour":""},{"ID":"I13","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Cartographier les besoins de formation de l’équipe","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Les deux","Format (détail)":"Avec ou sans outil numérique","Durée":"45 min","Pour qui":"enseignants et personnels éducatifs. L’ISFEC peut se charger de ce projet","Objectif":"repérer les besoins individuels et collectifs de formation sur l’IA pour choisir des priorités communes.","Étapes":"1. Chacun répond seul à un court quiz d’auto-positionnement (fonctionnement, éthique, cadre, données). Les réponses restent personnelles.\n2. Collecte anonyme des zones d’incertitude : main levée, tableau où chacun coche, ou sondage anonyme.\n3. L’équipe repère les grandes tendances, sans viser personne.\n4. Elle choisit deux ou trois priorités et esquisse un plan de formation.","Moyens":"un quiz, un support de collecte anonyme, 45 min.","Indicateur de réussite":"deux ou trois priorités de formation sont actées.","Point de vigilance":"on se situe, on ne s’évalue pas. L’anonymat est indispensable.","Mise à jour":""},{"ID":"I14","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Partager une pratique, enrichir l’équipe","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"1 h 30","Pour qui":"enseignants et personnels, atelier entre pairs","Objectif":"partager expériences et réflexions sur l’IA et en garder une trace utile à tous.","Étapes":"1. Chacun prépare cinq minutes : une pratique testée, une ressource, une question sans réponse ou un échec instructif.\n2. Chaque présentation est suivie de dix minutes d’échange : qu’est-ce que cela inspire ? Quelles adaptations ?\n3. Un rapporteur note les points saillants.\n4. Le groupe rédige une fiche par pratique : contexte, description, points d’attention, ressources.","Moyens":"1 h 30, un espace partagé pour les fiches.","Indicateur de réussite":"les fiches sont rangées dans l’espace partagé de l’équipe.","Point de vigilance":"les échecs et les doutes sont aussi précieux que les réussites.","Mise à jour":""},{"ID":"I15","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Repenser une évaluation existante","Public (texte de la fiche)":"2nd degré","Degré":"2nd degré","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"enseignants, en équipe ou seuls","Objectif":"adapter une évaluation habituelle pour qu’elle rende visible le raisonnement de l’élève, et pas seulement sa production finale.","Étapes":"1. Chacun choisit une évaluation qu’il propose régulièrement.\n2. Trois questions : que mesure-t-elle vraiment ? Qu’est-ce qu’un élève pourrait produire avec une IA sans avoir rien appris ? Quelle modification rendrait le raisonnement visible ?\n3. Reformulation : justification orale, étape intermédiaire, explicitation de la démarche.\n4. Mise en commun : ce qui est transposable tout de suite, ce qui demande un changement plus profond.","Moyens":"une évaluation apportée par chacun.","Indicateur de réussite":"chaque participant repart avec une évaluation modifiée.","Point de vigilance":"ce travail améliore l’évaluation en général, au-delà de la question de l’IA.","Mise à jour":""},{"ID":"I16","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Changer un critère","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Débranchée","Format (détail)":"Débranchée","Durée":"45 min","Pour qui":"enseignants et personnels éducatifs","Objectif":"intégrer dans une grille d’évaluation existante au moins un critère qui porte sur la démarche.","Étapes":"1. Chacun apporte une grille ou une consigne notée habituelle.\n2. En binômes, on repère ce que la grille évalue (résultat, forme, conformité) et ce qu’elle laisse invisible (démarche, raisonnement, repérage de ses erreurs).\n3. On ajoute ou reformule un critère qui rende ces éléments évaluables.\n4. Partage des nouvelles grilles.","Moyens":"les grilles de chacun.","Indicateur de réussite":"la grille modifiée est utilisée dans le mois.","Point de vigilance":"un seul critère bien choisi vaut mieux qu’une grille alourdie.","Mise à jour":""},{"ID":"I17","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Les angles invisibles","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique (démonstration)","Durée":"45 min","Pour qui":"enseignants et personnels éducatifs","Objectif":"repérer les biais culturels, de genre ou de point de vue dans des réponses d’IA.","Étapes":"1. L’animateur soumet la même consigne à deux IA différentes et projette les réponses côte à côte. Exemples : « Décris le quotidien d’une personne qui dirige une école », « Cite les dix plus grands philosophes ».\n2. Chacun analyse : quels exemples ? Quelle culture, quelle époque ? Quelles voix sont absentes ?\n3. Mise en commun des biais repérés et de leur origine : données, choix des concepteurs, langue dominante.\n4. Question finale : comment garder ce réflexe dans nos usages quotidiens ?","Moyens":"un vidéoprojecteur, deux outils d’IA autorisés.","Indicateur de réussite":"l’équipe nomme au moins trois types de biais.","Point de vigilance":"l’important est le principe de comparaison, pas le choix d’un outil particulier.","Mise à jour":""},{"ID":"I18","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Trois niveaux en une consigne","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"45 min","Pour qui":"enseignants","Objectif":"utiliser l’IA pour préparer rapidement des supports différenciés, en gardant un regard critique.","Étapes":"1. Chacun choisit un support habituel : texte documentaire, énoncé, consigne d’écriture.\n2. Il demande à l’IA trois versions de difficulté différente, en précisant le niveau, les obstacles et l’objectif (méthode RACE).\n3. Analyse : les versions sont-elles vraiment différenciées, ou seulement reformulées ? Que faut-il ajuster ?\n4. Mise en commun : gains de temps réels et limites observées.","Moyens":"un outil d’IA autorisé, un support par participant.","Indicateur de réussite":"chacun repart avec trois versions relues et ajustées.","Point de vigilance":"aucune donnée sur les élèves dans la consigne. C’est le professeur qui sait quelle version convient à qui.","Mise à jour":""},{"ID":"I19","Coup de cœur":"Non","Niveau":"Établissement et équipe","Titre":"Rendre un document accessible","Public (texte de la fiche)":"Tous degrés","Degré":"1er et 2nd degrés","Format":"Avec un outil numérique","Format (détail)":"Avec un outil numérique","Durée":"30 min","Pour qui":"enseignants","Objectif":"améliorer l’accessibilité d’un document pédagogique avec l’aide de l’IA.","Étapes":"1. Choisir un document de classe et vérifier qu’il ne contient aucune donnée personnelle.\n2. Demander à l’IA de simplifier le vocabulaire, de structurer le texte en paragraphes courts, de mettre en valeur les mots-clés.\n3. Analyser : qu’est-ce qui est bien adapté ? Que faut-il reprendre ?\n4. En équipe : quelles adap
